
<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Luleshitore</title>
<style>
*{box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#f2f7f3;margin:0;color:#234}
header{background:#176443;color:white;padding:18px;text-align:center}
header h1{margin:0}
main{max-width:1000px;margin:auto;padding:12px}
.card{background:white;border-radius:12px;padding:17px;margin:12px 0;box-shadow:0 2px 8px #0001}
input,select,button{font:inherit;padding:12px;border-radius:8px;margin:5px 0}
input,select{width:100%;border:1px solid #ccc}
button{border:0;background:#187b53;color:white;cursor:pointer}
button:disabled{opacity:.5}
nav{display:flex;gap:5px;overflow-x:auto;padding:10px 0}
nav button{white-space:nowrap;background:#dcece2;color:#155c43}
nav button.active{background:#155c43;color:white}
.hidden{display:none}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{background:#e4f4e9;padding:14px;border-radius:10px}
.stat strong{display:block;font-size:23px;margin-top:8px}
table{width:100%;border-collapse:collapse}
td,th{padding:9px;border-bottom:1px solid #ddd;text-align:left}
.scroll{overflow-x:auto}
#reader{max-width:420px;margin:auto}
#message{padding:12px;text-align:center;display:none}
.error{background:#ffe0e0;color:#900}
.ok{background:#e0f5e7;color:#165c39}
small{color:#777}
</style>
</head>
<body>

<header>
<h1>🌹 Luleshitore</h1>
<p>Menaxhimi i stokut dhe shitjeve</p>
<button id="logout" class="hidden">Dil nga llogaria</button>
</header>

<div id="message"></div>

<main>
<section id="login" class="card">
<h2>Hyr në aplikacion</h2>
<form id="loginForm">
<label>Email</label>
<input id="email" type="email" required>
<label>Fjalëkalimi</label>
<input id="password" type="password" required>
<button type="submit">Hyr</button>
</form>
</section>

<section id="application" class="hidden">
<nav id="navigation"></nav>
<div id="content"></div>
</section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<script>
const SUPABASE_URL =
'https://ckmyfeafckmxjvdllcdk.supabase.co';

const SUPABASE_KEY =
'sb_publishable_tqbrr3-JeJDFbPqmCfxd1Q_1-T26C3z';

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const el = id => document.getElementById(id);

let products = [];
let movements = [];
let expenses = [];
let page = 'Dashboard';
let scanner = null;
let busy = false;

const pages = [
  'Dashboard',
  'Produktet',
  'Hyrjet',
  'Shitjet',
  'Stoku',
  'Dëmet',
  'Shpenzimet',
  'Raportet'
];

function euro(n) {
  return Number(n || 0).toFixed(2) + ' €';
}

function safe(value) {
  return String(value ?? '').replace(
    /[&<>"']/g,
    c => ({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#39;'
    })[c]
  );
}

function notify(text, error=false) {
  const box = el('message');
  box.textContent = text;
  box.className = error ? 'error' : 'ok';
  box.style.display = 'block';
  setTimeout(() => {
    if (box.textContent === text) {
      box.style.display = 'none';
    }
  }, 5000);
}

function report(error) {
  notify(error.message || String(error), true);
}

async function loadTable(name) {
  const result = await db.from(name)
    .select('*')
    .order('id', {ascending:false});

  if (result.error) throw result.error;
  return result.data || [];
}

async function refresh() {
  try {
    [products, movements, expenses] = await Promise.all([
      loadTable('products'),
      loadTable('stock_movements'),
      loadTable('expenses')
    ]);
    render();
  } catch(error) {
    report(error);
  }
}

function input(id, label, type='text', step='') {
  return `
    <label for="${id}">${label}</label>
    <input id="${id}" type="${type}"
      ${step ? `step="${step}"` : ''}
      required>
  `;
}

function productSelect() {
  return `
    <label>Produkti</label>
    <select id="productId" required>
      ${products.map(p => `
        <option value="${p.id}">
          ${safe(p.name)} - ${p.stock} copë
        </option>
      `).join('')}
    </select>
  `;
}

function history(type) {
  const records = movements
    .filter(m => m.movement_type === type)
    .slice(0, 30);

  return `
    <div class="card scroll">
      <h3>Regjistrimet e fundit</h3>
      <table>
        <tr>
          <th>Data</th>
          <th>Produkti</th>
          <th>Sasia</th>
        </tr>
        ${records.map(m => {
          const product = products.find(
            p => p.id === m.product_id
          );
          return `
            <tr>
              <td>${new Date(m.created_at).toLocaleDateString()}</td>
              <td>${safe(product?.name || 'Produkt')}</td>
              <td>${m.quantity}</td>
            </tr>
          `;
        }).join('')}
      </table>
    </div>
  `;
}

function render() {
  el('navigation').innerHTML = pages.map(name => `
    <button data-page="${name}"
      class="${page === name ? 'active' : ''}">
      ${name}
    </button>
  `).join('');

  document.querySelectorAll('[data-page]').forEach(button => {
    button.onclick = async () => {
      await stopScanner();
      page = button.dataset.page;
      render();
    };
  });

  const sales = movements.filter(
    m => m.movement_type === 'sale'
  );

  const damages = movements.filter(
    m => m.movement_type === 'damage'
  );

  const revenue = sales.reduce(
    (s,m) => s + Number(m.unit_price || 0)*m.quantity, 0
  );

  const cost = sales.reduce(
    (s,m) => s + Number(m.unit_cost || 0)*m.quantity, 0
  );

  const damageCost = damages.reduce(
    (s,m) => s + Number(m.unit_cost || 0)*m.quantity, 0
  );

  const expenseTotal = expenses.reduce(
    (s,e) => s + Number(e.amount || 0), 0
  );

  const profit = revenue-cost-damageCost-expenseTotal;
  let html = '';

  if (page === 'Dashboard') {
    html = `
      <div class="grid">
        <div class="stat">Shitjet<strong>${euro(revenue)}</strong></div>
        <div class="stat">Fitimi<strong>${euro(profit)}</strong></div>
        <div class="stat">Produkte<strong>${products.length}</strong></div>
        <div class="stat">Stok i ulët<strong>${
          products.filter(p => p.stock <= 10).length
        }</strong></div>
      </div>
      <div class="card">
        <h2>Mirë se erdhe 🌷</h2>
        <p>Shto produktet, regjistro hyrjet dhe shitjet.</p>
        <button id="reload">🔄 Rifresko</button>
      </div>
    `;
  }

  if (page === 'Produktet') {
    html = `
      <div class="card">
        <h2>Shto produkt</h2>
        <form id="productForm">
          ${input('name','Emri i lules')}
          ${input('barcode','Barkodi')}
          ${input('purchase','Çmimi i blerjes (€)','number','0.01')}
          ${input('price','Çmimi i shitjes (€)','number','0.01')}
          <button type="submit">Ruaj produktin</button>
        </form>
      </div>
      <div class="card scroll">
        <h3>Lista e produkteve</h3>
        <table>
          <tr>
            <th>Emri</th><th>Barkodi</th>
            <th>Çmimi</th><th>Stoku</th>
          </tr>
          ${products.map(p => `
            <tr>
              <td>${safe(p.name)}</td>
              <td>${safe(p.barcode)}</td>
              <td>${euro(p.sale_price)}</td>
              <td>${p.stock}</td>
            </tr>
          `).join('')}
        </table>
      </div>
    `;
  }

  if (['Hyrjet','Shitjet','Dëmet'].includes(page)) {
    const type = page === 'Hyrjet'
      ? 'entry'
      : page === 'Shitjet' ? 'sale' : 'damage';

    html = `
      <div class="card">
        <h2>${page}</h2>
        <form id="movementForm">
          ${type === 'sale' ? `
            <label>Barkodi</label>
            <input id="barcodeSearch"
              placeholder="Shkruaj ose skano barkodin">
            <button id="scanButton" type="button">
              📷 Skano me kamerë
            </button>
            <div id="reader"></div>
          ` : ''}
          ${productSelect()}
          ${input('quantity','Sasia','number','1')}
          <p id="selectedProduct"></p>
          <button type="submit">
            ${type === 'sale' ? 'Konfirmo shitjen' : 'Ruaj'}
          </button>
        </form>
      </div>
      ${history(type)}
    `;
  }

  if (page === 'Stoku') {
    html = `
      <div class="card scroll">
        <h2>Stoku aktual</h2>
        <table>
          <tr>
            <th>Produkti</th><th>Barkodi</th>
            <th>Sasia</th><th>Vlera</th>
          </tr>
          ${products.map(p => `
            <tr>
              <td>${safe(p.name)}</td>
              <td>${safe(p.barcode)}</td>
              <td>${p.stock}</td>
              <td>${euro(p.stock * p.purchase_price)}</td>
            </tr>
          `).join('')}
        </table>
      </div>
    `;
  }

  if (page === 'Shpenzimet') {
    html = `
      <div class="card">
        <h2>Regjistro shpenzim</h2>
        <form id="expenseForm">
          ${input('description','Përshkrimi')}
          ${input('amount','Shuma (€)','number','0.01')}
          <button type="submit">Ruaj shpenzimin</button>
        </form>
      </div>
      <div class="card scroll">
        <h3>Shpenzimet</h3>
        <table>
          <tr><th>Data</th><th>Përshkrimi</th><th>Shuma</th></tr>
          ${expenses.map(e => `
            <tr>
              <td>${new Date(e.created_at).toLocaleDateString()}</td>
              <td>${safe(e.description)}</td>
              <td>${euro(e.amount)}</td>
            </tr>
          `).join('')}
        </table>
      </div>
    `;
  }

  if (page === 'Raportet') {
    html = `
      <div class="card">
        <h2>Raporti financiar</h2>
        <p>Shitjet: <b>${euro(revenue)}</b></p>
        <p>Kosto e produkteve: <b>${euro(cost)}</b></p>
        <p>Dëmet: <b>${euro(damageCost)}</b></p>
        <p>Shpenzimet: <b>${euro(expenseTotal)}</b></p>
        <hr>
        <h3>Fitimi: ${euro(profit)}</h3>
        <small>Raporti për të gjitha regjistrimet.</small>
      </div>
    `;
  }

  el('content').innerHTML = html;

  if (el('reload')) el('reload').onclick = refresh;

  if (el('productForm')) {
    el('productForm').onsubmit = async e => {
      e.preventDefault();
      if (busy) return;
      busy = true;
      try {
        const name = el('name').value.trim();
        const barcode = el('barcode').value.trim();
        const purchase_price = Number(el('purchase').value);
        const sale_price = Number(el('price').value);

        if (!name || !barcode ||
            !Number.isFinite(purchase_price) ||
            !Number.isFinite(sale_price) ||
            purchase_price < 0 || sale_price < 0) {
          throw Error('Kontrollo të dhënat');
        }

        const result = await db.from('products').insert({
          name, barcode, purchase_price, sale_price, stock:0
        });

        if (result.error) throw result.error;
        notify('Produkti u ruajt');
        await refresh();
      } catch(error) {
        report(error);
      } finally {
        busy = false;
      }
    };
  }

  if (el('expenseForm')) {
    el('expenseForm').onsubmit = async e => {
      e.preventDefault();
      if (busy) return;
      busy = true;
      try {
        const description = el('description').value.trim();
        const amount = Number(el('amount').value);

        if (!description || !(amount > 0)) {
          throw Error('Kontrollo shpenzimin');
        }

        const result = await db.from('expenses').insert({
          description, amount
        });

        if (result.error) throw result.error;
        notify('Shpenzimi u ruajt');
        await refresh();
      } catch(error) {
        report(error);
      } finally {
        busy = false;
      }
    };
  }

  if (el('movementForm')) {
    const type = page === 'Hyrjet'
      ? 'entry'
      : page === 'Shitjet' ? 'sale' : 'damage';

    const showProduct = () => {
      const p = products.find(
        p => p.id === Number(el('productId').value)
      );
      el('selectedProduct').textContent = p
        ? `${p.name} | ${euro(p.sale_price)} | Stoku: ${p.stock}`
        : '';
    };

    el('productId').onchange = showProduct;
    showProduct();

    el('movementForm').onsubmit = async e => {
      e.preventDefault();
      if (busy) return;
      busy = true;

      try {
        const quantity = Number(el('quantity').value);
        const productId = Number(el('productId').value);

        if (!Number.isInteger(quantity) || quantity <= 0) {
          throw Error('Sasia duhet të jetë numër pozitiv');
        }

        const result = await db.rpc(
          'record_stock_movement',
          {
            p_product_id: productId,
            p_movement_type: type,
            p_quantity: quantity
          }
        );

        if (result.error) throw result.error;
        notify('Regjistrimi u krye me sukses');
        await refresh();
      } catch(error) {
        report(error);
      } finally {
        busy = false;
      }
    };

    if (el('barcodeSearch')) {
      el('barcodeSearch').oninput = () => {
        const code = el('barcodeSearch').value.trim();
        const p = products.find(p => p.barcode === code);

        if (p) {
          el('productId').value = p.id;
          showProduct();
        } else if (code) {
          el('selectedProduct').textContent =
            'Barkodi nuk u gjet';
        }
      };

      el('scanButton').onclick = toggleScanner;
    }
  }
}

async function stopScanner() {
  if (!scanner) return;
  try { await scanner.stop(); } catch(e) {}
  try { scanner.clear(); } catch(e) {}
  scanner = null;
}

async function toggleScanner() {
  if (scanner) {
    await stopScanner();
    return;
  }

  if (!window.Html5Qrcode) {
    notify('Kamera nuk u ngarkua. Kontrollo internetin.', true);
    return;
  }

  try {
    scanner = new Html5Qrcode('reader');

    await scanner.start(
      {facingMode:'environment'},
      {fps:10,qrbox:{width:260,height:160}},
      async code => {
        await stopScanner();
        const field = el('barcodeSearch');
        if (field) {
          field.value = code;
          field.dispatchEvent(new Event('input'));
          notify('Barkodi u skanua: ' + code);
        }
      }
    );
  } catch(error) {
    await stopScanner();
    report(error);
  }
}

async function showSession(session) {
  const loggedIn = !!session;

  el('login').classList.toggle('hidden', loggedIn);
  el('application').classList.toggle('hidden', !loggedIn);
  el('logout').classList.toggle('hidden', !loggedIn);

  if (loggedIn) {
    await refresh();
  } else {
    await stopScanner();
    products = [];
    movements = [];
    expenses = [];
  }
}

el('loginForm').onsubmit = async e => {
  e.preventDefault();
  const button = e.target.querySelector('button');
  button.disabled = true;

  try {
    const result = await db.auth.signInWithPassword({
      email: el('email').value.trim(),
      password: el('password').value
    });

    if (result.error) throw result.error;
  } catch(error) {
    report(error);
  } finally {
    button.disabled = false;
  }
};

el('logout').onclick = async () => {
  const result = await db.auth.signOut();
  if (result.error) report(result.error);
};

db.auth.onAuthStateChange((event, session) => {
  setTimeout(() => {
    showSession(session).catch(report);
  }, 0);
});

setInterval(async () => {
  if (!el('application').classList.contains('hidden')
      && !scanner && !busy) {
    await refresh();
  }
}, 15000);
</script>
</body>
</html>
