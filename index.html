
<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Luleshitore</title>
<style>
*{box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#f2f7f3;margin:0;color:#234}
header{background:#176443;color:white;padding:18px;text-align:center}
header h1{margin:0}
main{max-width:1000px;margin:auto;padding:12px}
.card{background:white;border-radius:12px;padding:17px;margin:12px 0;box-shadow:0 2px 8px #0001}
input,select,button{font:inherit;padding:12px;border-radius:8px;margin:5px 0}
input,select{width:100%;border:1px solid #ccc}
button{border:0;background:#187b53;color:white;cursor:pointer}
button:disabled{opacity:.5}
nav{display:flex;gap:5px;overflow-x:auto;padding:10px 0}
nav button{white-space:nowrap;background:#dcece2;color:#155c43}
nav button.active{background:#155c43;color:white}
.hidden{display:none}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{background:#e4f4e9;padding:14px;border-radius:10px}
.stat strong{display:block;font-size:23px;margin-top:8px}
table{width:100%;border-collapse:collapse}
td,th{padding:9px;border-bottom:1px solid #ddd;text-align:left}
.scroll{overflow-x:auto}
#reader{max-width:420px;margin:auto}
#message{padding:12px;text-align:center;display:none}
.error{background:#ffe0e0;color:#900}
.ok{background:#e0f5e7;color:#165c39}
small{color:#777}
</style>
</head>
<body>

<header>
<h1>🌹 Luleshitore</h1>
<p>Menaxhimi i stokut dhe shitjeve</p>
<button id="logout" class="hidden">Dil nga llogaria</button>
</header>

<div id="message"></div>

<main>
<section id="login" class="card">
<h2>Hyr në aplikacion</h2>
<form id="loginForm">
<label>Email</label>
<input id="email" type="email" required>
<label>Fjalëkalimi</label>
<input id="password" type="password" required>
<button type="submit">Hyr</button>
</form>
</section>

<section id="application" class="hidden">
<nav id="navigation"></nav>
<div id="content"></div>
</section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<script>
const SUPABASE_URL =
'https://ckmyfeafckmxjvdllcdk.supabase.co';

const SUPABASE_KEY =
'sb_publishable_tqbrr3-JeJDFbPqmCfxd1Q_1-T26C3z';

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const el = id => document.getElementById(id);

let products = [];
let movements = [];
let expenses = [];
let page = 'Dashboard';
let scanner = null;
let busy = false;

const pages = [
  'Dashboard',
  'Produktet',
  'Hyrjet',
  'Shitjet',
  'Stoku',
  'Dëmet',
  'Shpenzimet',
  'Raportet'
];

function euro(n) {
  return Number(n || 0).toFixed(2) + ' €';
}

function safe(value) {
  return String(value ?? '').replace(
    /[&<>"']/g,
    c => ({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#39;'
    })[c]
  );
}

function notify(text, error=false) {
  const box = el('message');
  box.textContent = text;
  box.className = error ? 'error' : 'ok';
  box.style.display = 'block';
  setTimeout(() => {
    if (box.textContent === text) {
      box.style.display = 'none';
    }
  }, 5000);
}

function report(error) {
  notify(error.message || String(error), true);
}

async function loadTable(name) {
  const result = await db.from(name)
    .select('*')
    .order('id', {ascending:false});

  if (result.error) throw result.error;
  return result.data || [];
}

async function refresh() {
  try {
    [products, movements, expenses] = await Promise.all([
      loadTable('products'),
      loadTable('stock_movements'),
      loadTable('expenses')
    ]);
    render();
  } catch(error) {
    report(error);
  }
}

function input(id, label, type='text', step='') {
  return `
    <label for="${id}">${label}</label>
    <input id="${id}" type="${type}"
      ${step ? `step="${step}"` : ''}
      required>
  `;
}

function productSelect() {
  return `
    <label>Produkti</label>
    <select id="productId" required>
      ${products.map(p => `
        <option value="${p.id}">
          ${safe(p.name)} - ${p.stock} copë
        </option>
      `).join('')}
    </select>
  `;
}

function history(type) {
  const records = movements
    .filter(m => m.movement_type === type)
    .slice(0, 30);

  return `
    <div class="card scroll">
      <h3>Regjistrimet e fundit</h3>
      <table>
        <tr>
          <th>Data</th>
          <th>Produkti</th>
          <th>Sasia</th>
        </tr>
        ${records.map(m => {
          const product = products.find(
            p => p.id === m.product_id
          );
          return `
            <tr>
              <td>${new Date(m.created_at).toLocaleDateString()}</td>
              <td>${safe(product?.name || 'Produkt')}</td>
              <td>${m.quantity}</td>
            </tr>
          `;
        }).join('')}
      </table>
    </div>
  `;
}

function render() {
  el('navigation').innerHTML = pages.map(name => `
    <button data-page="${name}"
      class="${page === name ? 'active' : ''}">
      ${name}
    </button>
  `).join('');

  document.querySelectorAll('[data-page]').forEach(button => {
    button.onclick = async () => {
      await stopScanner();
      page = button.dataset.page;
      render();
    };
  });

  const sales = movements.filter(
    m => m.movement_type === 'sale'
  );

  const damages = movements.filter(
    m => m.movement_type === 'damage'
  );

  const revenue = sales.reduce(
    (s,m) => s + Number(m.unit_price || 0)*m.quantity, 0
  );

  const cost = sales.reduce(
    (s,m) => s + Number(m.unit_cost || 0)*m.quantity, 0
  );

  const damageCost = damages.reduce(
    (s,m) => s + Number(m.unit_cost || 0)*m.quantity, 0
  );

  const expenseTotal = expenses.reduce(
    (s,e) => s + Number(e.amount || 0), 0
  );

  const profit = revenue-cost-damageCost-expenseTotal;
  let html = '';

  if (page === 'Dashboard') {
    html = `
      <div class="grid">
        <div class="stat">Shitjet<strong>${euro(revenue)}</strong></div>
        <div class="stat">Fitimi<strong>${euro(profit)}</strong></div>
        <div class="stat">Produkte<strong>${products.length}</strong></div>
        <div class="stat">Stok i ulët<strong>${
          products.filter(p => p.stock <= 10).length
        }</strong></div>
      </div>
      <div class="card">
        <h2>Mirë se erdhe 🌷</h2>
        <p>Shto produktet, regjistro hyrjet dhe shitjet.</p>
        <button id="reload">🔄 Rifresko</button>
      </div>
    `;
  }

  if (page === 'Produktet') {
    html = `
      <div class="card">
        <h2>Shto produkt</h2>
        <form id="productForm">
          ${input('name','Emri i lules')}
          ${input('barcode','Barkodi')}
          ${input('purchase','Çmimi i blerjes (€)','number','0.01')}
          ${input('price','Çmimi i shitjes (€)','number','0.01')}
          <button type="submit">Ruaj produktin</button>
        </form>
      </div>
      <div class="card scroll">
        <h3>Lista e produkteve</h3>
        <table>
          <tr>
            <th>Emri</th><th>Barkodi</th>
            <th>Çmimi</th><th>Stoku</th>
          </tr>
          ${products.map(p => `
            <tr>
              <td>${safe(p.name)}</td>
              <td>${safe(p.barcode)}</td>
              <td>${euro(p.sale_price)}</td>
              <td>${p.stock}</td>
            </tr>
          `).join('')}
        </table>
      </div>
    `;
  }

  if (['Hyrjet','Shitjet','Dëmet'].includes(page)) {
    const type = page === 'Hyrjet'
      ? 'entry'
      : page === 'Shitjet' ? 'sale' : 'damage';

    html = `
      <div class="card">
        <h2>${page}</h2>
        <form id="movementForm">
          ${type === 'sale' ? `
            <label>Barkodi</label>
            <input id="barcodeSearch"
              placeholder="Shkruaj ose skano barkodin">
            <button id="scanButton" type="button">
              📷 Skano me kamerë
            </button>
            <div id="reader"></div>
          ` : ''}
          ${productSelect()}
          ${input('quantity','Sasia','number','1')}
          <p id="selectedProduct"></p>
          <button type="submit">
            ${type === 'sale' ? 'Konfirmo shitjen' : 'Ruaj'}
          </button>
        </form>
      </div>
      ${history(type)}
    `;
  }

  if (page === 'Stoku') {
    html = `
      <div class="card scroll">
        <h2>Stoku aktual</h2>
        <table>
          <tr>
            <th>Produkti</th><th>Barkodi</th>
            <th>Sasia</th><th>Vlera</th>
          </tr>
          ${products.map(p => `
            <tr>
              <td>${safe(p.name)}</td>
              <td>${safe(p.barcode)}</td>
              <td>${p.stock}</td>
              <td>${euro(p.stock * p.purchase_price)}</td>
            </tr>
          `).join('')}
        </table>
      </div>
    `;
  }

  if (page === 'Shpenzimet') {
    html = `
      <div class="card">
        <h2>Regjistro shpenzim</h2>
        <form id="expenseForm">
          ${input('description','Përshkrimi')}
          ${input('amount','Shuma (€)','number','0.01')}
          <button type="submit">Ruaj shpenzimin</button>
        </form>
      </div>
      <div class="card scroll">
        <h3>Shpenzimet</h3>
        <table>
          <tr><th>Data</th><th>Përshkrimi</th><th>Shuma</th></tr>
          ${expenses.map(e => `
            <tr>
              <td>${new Date(e.created_at).toLocaleDateString()}</td>
              <td>${safe(e.description)}</td>
              <td>${euro(e.amount)}</td>
            </tr>
          `).join('')}
        </table>
      </div>
    `;
  }

  if (page === 'Raportet') {
    html = `
      <div class="card">
        <h2>Raporti financiar</h2>
        <p>Shitjet: <b>${euro(revenue)}</b></p>
        <p>Kosto e produkteve: <b>${euro(cost)}</b></p>
        <p>Dëmet: <b>${euro(damageCost)}</b></p>
        <p>Shpenzimet: <b>${euro(expenseTotal)}</b></p>
        <hr>
        <h3>Fitimi: ${euro(profit)}</h3>
        <small>Raporti për të gjitha regjistrimet.</small>
      </div>
    `;
  }

  el('content').innerHTML = html;

  if (el('reload')) el('reload').onclick = refresh;

  if (el('productForm')) {
    el('productForm').onsubmit = async e => {
      e.preventDefault();
      if (busy) return;
      busy = true;
      try {
        const name = el('name').value.trim();
        const barcode = el('barcode').value.trim();
        const purchase_price = Number(el('purchase').value);
        const sale_price = Number(el('price').value);

        if (!name || !barcode ||
            !Number.isFinite(purchase_price) ||
            !Number.isFinite(sale_price) ||
            purchase_price < 0 || sale_price < 0) {
          throw Error('Kontrollo të dhënat');
        }

        const result = await db.from('products').insert({
          name, barcode, purchase_price, sale_price, stock:0
        });

        if (result.error) throw result.error;
        notify('Produkti u ruajt');
        await refresh();
      } catch(error) {
        report(error);
      } finally {
        busy = false;
      }
    };
  }

  if (el('expenseForm')) {
    el('expenseForm').onsubmit = async e => {
      e.preventDefault();
      if (busy) return;
      busy = true;
      try {
        const description = el('description').value.trim();
        const amount = Number(el('amount').value);

        if (!description || !(amount > 0)) {
          throw Error('Kontrollo shpenzimin');
        }

        const result = await db.from('expenses').insert({
          description, amount
        });

        if (result.error) throw result.error;
        notify('Shpenzimi u ruajt');
        await refresh();
      } catch(error) {
        report(error);
      } finally {
        busy = false;
      }
    };
  }

  if (el('movementForm')) {
    const type = page === 'Hyrjet'
      ? 'entry'
      : page === 'Shitjet' ? 'sale' : 'damage';

    const showProduct = () => {
      const p = products.find(
        p => p.id === Number(el('productId').value)
      );
      el('selectedProduct').textContent = p
        ? `${p.name} | ${euro(p.sale_price)} | Stoku: ${p.stock}`
        : '';
    };

    el('productId').onchange = showProduct;
    showProduct();

    el('movementForm').onsubmit = async e => {
      e.preventDefault();
      if (busy) return;
      busy = true;

      try {
        const quantity = Number(el('quantity').value);
        const productId = Number(el('productId').value);

        if (!Number.isInteger(quantity) || quantity <= 0) {
          throw Error('Sasia duhet të jetë numër pozitiv');
        }

        const result = await db.rpc(
          'record_stock_movement',
          {
            p_product_id: productId,
            p_movement_type: type,
            p_quantity: quantity
          }
        );

        if (result.error) throw result.error;
        notify('Regjistrimi u krye me sukses');
        await refresh();
      } catch(error) {
        report(error);
      } finally {
        busy = false;
      }
    };

    if (el('barcodeSearch')) {
      el('barcodeSearch').oninput = () => {
        const code = el('barcodeSearch').value.trim();
        const p = products.find(p => p.barcode === code);

        if (p) {
          el('productId').value = p.id;
          showProduct();
        } else if (code) {
          el('selectedProduct').textContent =
            'Barkodi nuk u gjet';
        }
      };

      el('scanButton').onclick = toggleScanner;
    }
  }
}

async function stopScanner() {
  if (!scanner) return;
  try { await scanner.stop(); } catch(e) {}
  try { scanner.clear(); } catch(e) {}
  scanner = null;
}

async function toggleScanner() {
  if (scanner) {
    await stopScanner();
    return;
  }

  if (!window.Html5Qrcode) {
    notify('Kamera nuk u ngarkua. Kontrollo internetin.', true);
    return;
  }

  try {
    scanner = new Html5Qrcode('reader');

    await scanner.start(
      {facingMode:'environment'},
      {fps:10,qrbox:{width:260,height:160}},
      async code => {
        await stopScanner();
        const field = el('barcodeSearch');
        if (field) {
          field.value = code;
          field.dispatchEvent(new Event('input'));
          notify('Barkodi u skanua: ' + code);
        }
      }
    );
  } catch(error) {
    await stopScanner();
    report(error);
  }
}

async function showSession(session) {
  const loggedIn = !!session;

  el('login').classList.toggle('hidden', loggedIn);
  el('application').classList.toggle('hidden', !loggedIn);
  el('logout').classList.toggle('hidden', !loggedIn);

  if (loggedIn) {
    await refresh();
  } else {
    await stopScanner();
    products = [];
    movements = [];
    expenses = [];
  }
}

el('loginForm').onsubmit = async e => {
  e.preventDefault();
  const button = e.target.querySelector('button');
  button.disabled = true;

  try {
    const result = await db.auth.signInWithPassword({
      email: el('email').value.trim(),
      password: el('password').value
    });

    if (result.error) throw result.error;
  } catch(error) {
    report(error);
  } finally {
    button.disabled = false;
  }
};

el('logout').onclick = async () => {
  const result = await db.auth.signOut();
  if (result.error) report(result.error);
};

db.auth.onAuthStateChange((event, session) => {
  setTimeout(() => {
    showSession(session).catch(report);
  }, 0);
});

setInterval(async () => {
  if (!el('application').classList.contains('hidden')
      && !scanner && !busy) {
    await refresh();
  }
}, 15000);
</script>
  
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>

<style>
.barcode-label {
  background:white;
  color:black;
  border:1px dashed #777;
  padding:18px;
  margin:15px auto;
  text-align:center;
  max-width:340px;
}
.barcode-label canvas {
  max-width:100%;
}
@media print {
  body * { visibility:hidden !important; }
  #barcodeLabel,
  #barcodeLabel * { visibility:visible !important; }
  #barcodeLabel {
    position:absolute;
    top:0;
    left:0;
    width:75mm;
    border:0;
    margin:0;
  }
}
</style>

<script>
(function () {
  let lastLabel = null;

  function makeBarcode() {
    const bytes = new Uint8Array(6);
    crypto.getRandomValues(bytes);

    const digits = '29' + Array.from(
      bytes,
      b => String(b % 100).padStart(2,'0')
    ).join('').slice(0,10);

    let sum = 0;
    for (let i=0; i<12; i++) {
      sum += Number(digits[i]) * (i%2===0 ? 1 : 3);
    }
    return digits + ((10-sum%10)%10);
  }

  function showLabel(product) {
    lastLabel = product;

    const area = document.getElementById('barcodeArea');
    if (!area) return;

    area.innerHTML = `
      <div id="barcodeLabel" class="barcode-label">
        <h3 id="labelName"></h3>
        <canvas id="barcodeCanvas"></canvas>
        <h2 id="labelPrice"></h2>
      </div>
      <button type="button" id="saveBarcode">
        📱 Ruaj barkodin në telefon
      </button>
      <button type="button" id="printBarcode">
        🖨️ Printo barkodin
      </button>
    `;

    document.getElementById('labelName').textContent =
      product.name;

    document.getElementById('labelPrice').textContent =
      Number(product.sale_price).toFixed(2) + ' €';

    try {
      JsBarcode('#barcodeCanvas', product.barcode, {
        format:'EAN13',
        displayValue:true,
        width:2,
        height:75,
        margin:8
      });
    } catch(error) {
      notify('Gabim gjatë krijimit të barkodit',true);
      return;
    }

    document.getElementById('saveBarcode').onclick = () => {
      const canvas = document.getElementById('barcodeCanvas');
      const image = document.createElement('canvas');
      image.width = 700;
      image.height = 370;

      const ctx = image.getContext('2d');
      ctx.fillStyle = 'white';
      ctx.fillRect(0,0,image.width,image.height);

      ctx.fillStyle = 'black';
      ctx.textAlign = 'center';

      ctx.font = 'bold 28px Arial';
      ctx.fillText(product.name,350,48,650);

      ctx.drawImage(canvas,75,65,550,210);

      ctx.font = 'bold 32px Arial';
      ctx.fillText(
        Number(product.sale_price).toFixed(2)+' €',
        350,330
      );

      image.toBlob(blob => {
        if (!blob) return;
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = 'barkod-'+product.barcode+'.png';
        link.click();
        setTimeout(() => URL.revokeObjectURL(url),10000);
      },'image/png');
    };

    document.getElementById('printBarcode').onclick = () => {
      window.print();
    };
  }

  function addBarcodeControls() {
    if (page !== 'Produktet') return;

    const form = document.getElementById('productForm');
    if (!form) return;

    const button = document.createElement('button');
    button.type = 'button';
    button.textContent = '▥ Krijo barkod automatik';

    const barcodeInput = document.getElementById('barcode');
    barcodeInput.before(button);

    button.onclick = () => {
      const code = makeBarcode();
      barcodeInput.value = code;
      barcodeInput.readOnly = true;
      notify('Barkodi u krijua. Plotëso emrin dhe çmimet.');
    };

    const area = document.createElement('div');
    area.id = 'barcodeArea';
    form.parentElement.appendChild(area);

    if (lastLabel) showLabel(lastLabel);

    form.addEventListener('submit', async () => {
      const code = barcodeInput.value.trim();
      const name = document.getElementById('name').value.trim();
      const price = Number(
        document.getElementById('price').value
      );

      if (!code || !name) return;

      setTimeout(async () => {
        try {
          const result = await db.from('products')
            .select('*')
            .eq('barcode',code)
            .maybeSingle();

          if (result.error) return;
          if (!result.data) return;

          lastLabel = result.data;
          if (page === 'Produktet') {
            showLabel(lastLabel);
          }
        } catch(error) {
          console.error(error);
        }
      },1500);
    });
  }

  const originalRender = render;
  render = function () {
    originalRender();
    addBarcodeControls();
  };
})();
</script>

<script>
(function () {
  const previousRender = render;

  function cash(n) {
    return Number(n || 0).toFixed(2) + ' €';
  }

  function dayKey(value) {
    const d = new Date(value);
    return d.getFullYear() + '-' +
      String(d.getMonth()+1).padStart(2,'0') + '-' +
      String(d.getDate()).padStart(2,'0');
  }

  function createReport() {
    const sales = movements.filter(
      m => m.movement_type === 'sale'
    );

    const damages = movements.filter(
      m => m.movement_type === 'damage'
    );

    const revenue = sales.reduce(
      (s,m) => s + Number(m.unit_price || 0)*m.quantity,0
    );

    const saleCost = sales.reduce(
      (s,m) => s + Number(m.unit_cost || 0)*m.quantity,0
    );

    const damageCost = damages.reduce(
      (s,m) => s + Number(m.unit_cost || 0)*m.quantity,0
    );

    const expensesTotal = expenses.reduce(
      (s,e) => s + Number(e.amount || 0),0
    );

    const profit =
      revenue-saleCost-damageCost-expensesTotal;

    const stockValue = products.reduce(
      (s,p) => s + Number(p.purchase_price || 0)*p.stock,0
    );

    const stockCount = products.reduce(
      (s,p) => s + Number(p.stock || 0),0
    );

    const days = [];
    const today = new Date();

    for (let i=6;i>=0;i--) {
      const d = new Date(
        today.getFullYear(),
        today.getMonth(),
        today.getDate()-i
      );

      const key = dayKey(d);

      const amount = sales
        .filter(m => dayKey(m.created_at) === key)
        .reduce(
          (s,m) => s + Number(m.unit_price || 0)*m.quantity,0
        );

      days.push({
        label:d.toLocaleDateString('sq-AL',{
          day:'2-digit',
          month:'2-digit'
        }),
        amount
      });
    }

    const max = Math.max(1,...days.map(d => d.amount));

    const cards = [
      ['💶','Shitjet',cash(revenue),'green'],
      ['📈','Fitimi',cash(profit),'green'],
      ['🧾','Shpenzimet',cash(expensesTotal),''],
      ['🥀','Dëmet',cash(damageCost),'orange'],
      ['📦','Vlera e stokut',cash(stockValue),''],
      ['🌷','Copë në stok',stockCount,''],
      ['🛒','Transaksione shitjeje',sales.length,''],
      ['🌹','Lloje produktesh',products.length,'']
    ];

    const cardsHTML = cards.map(c => `
      <div class="report-card ${c[3]}">
        <div class="symbol">${c[0]}</div>
        <span class="label">${c[1]}</span>
        <div class="value">${c[2]}</div>
      </div>
    `).join('');

    // Grafik SVG i krijuar nga të dhënat reale.
    const W = 700;
    const H = 260;
    const left = 45;
    const top = 15;
    const chartH = 185;
    const barSpace = (W-left-15)/7;

    let bars = '';

    days.forEach((day,i) => {
      const h = max > 0
        ? (day.amount/max)*chartH
        : 0;

      const x = left+i*barSpace+barSpace*.2;
      const y = top+chartH-h;
      const w = barSpace*.6;

      bars += `
        <rect x="${x}" y="${y}" width="${w}"
          height="${Math.max(h,2)}" rx="5"
          fill="#208a61"/>
        <text x="${x+w/2}" y="${Math.max(11,y-6)}"
          text-anchor="middle" font-size="11"
          fill="#40574a">${day.amount.toFixed(0)}€</text>
        <text x="${x+w/2}" y="226"
          text-anchor="middle" font-size="12"
          fill="#607469">${day.label}</text>
      `;
    });

    const chart = `
      <svg class="report-chart"
        viewBox="0 0 ${W} ${H}"
        preserveAspectRatio="xMidYMid meet"
        role="img"
        aria-label="Grafiku i shitjeve për shtatë ditët e fundit">
        <line x1="${left}" y1="${top+chartH}"
          x2="${W-15}" y2="${top+chartH}"
          stroke="#dce6df" stroke-width="2"/>
        ${bars}
      </svg>
    `;

    return `
      <div class="report-title">
        <div>
          <h2>📊 Raportet financiare</h2>
          <p>Pasqyra e luleshitores</p>
        </div>
        <div class="report-print">
          <button id="refreshReports">🔄 Rifresko</button>
          <button id="printReports">🖨️ Printo</button>
        </div>
      </div>

      <div class="report-cards">
        ${cardsHTML}
      </div>

      <div class="report-panel">
        <h3>📊 Shitjet – 7 ditët e fundit</h3>
        ${chart}
      </div>

      <div class="report-breakdown">
        <div class="report-panel">
          <h3>💰 Përmbledhja financiare</h3>
          <div class="report-line">
            <span>Të ardhurat</span>
            <strong>${cash(revenue)}</strong>
          </div>
          <div class="report-line">
            <span>Kosto e luleve të shitura</span>
            <strong>${cash(saleCost)}</strong>
          </div>
          <div class="report-line">
            <span>Dëmet</span>
            <strong>${cash(damageCost)}</strong>
          </div>
          <div class="report-line">
            <span>Shpenzimet</span>
            <strong>${cash(expensesTotal)}</strong>
          </div>
          <div class="report-line">
            <b>Fitimi i llogaritur</b>
            <strong>${cash(profit)}</strong>
          </div>
        </div>

        <div class="report-panel">
          <h3>🌷 Gjendja e stokut</h3>
          <div class="report-line">
            <span>Lloje produktesh</span>
            <strong>${products.length}</strong>
          </div>
          <div class="report-line">
            <span>Copë në stok</span>
            <strong>${stockCount}</strong>
          </div>
          <div class="report-line">
            <span>Vlera me çmim blerjeje</span>
            <strong>${cash(stockValue)}</strong>
          </div>
          <div class="report-line">
            <span>Produkte me stok 10 ose më pak</span>
            <strong>${
              products.filter(p => p.stock <= 10).length
            }</strong>
          </div>
          <p class="report-note">
            Raportet përdorin të gjitha regjistrimet.
            Fitimi është vlerësim sipas kostove dhe
            shpenzimeve të regjistruara.
          </p>
        </div>
      </div>
    `;
  }

  function setupNavigation() {
    const app = document.getElementById('application');
    const nav = document.getElementById('navigation');

    if (!app || !nav) return;

    let menu = document.getElementById('mobileNavButton');

    if (!menu) {
      menu = document.createElement('button');
      menu.id = 'mobileNavButton';
      menu.type = 'button';
      menu.textContent = '☰ Meny';
      app.insertBefore(menu,app.firstChild);

      menu.onclick = () => {
        document.body.classList.toggle('nav-open');
      };
    }

    let backdrop = document.getElementById('navBackdrop');

    if (!backdrop) {
      backdrop = document.createElement('div');
      backdrop.id = 'navBackdrop';
      document.body.appendChild(backdrop);

      backdrop.onclick = () => {
        document.body.classList.remove('nav-open');
      };
    }

    nav.querySelectorAll('button').forEach(button => {
      button.addEventListener('click',() => {
        document.body.classList.remove('nav-open');
      });
    });
  }

  function setupReports() {
    if (page !== 'Raportet') return;

    const content = document.getElementById('content');
    if (!content) return;

    content.innerHTML = createReport();

    document.getElementById('refreshReports').onclick =
      refresh;

    document.getElementById('printReports').onclick =
      () => window.print();
  }

  render = function () {
    previousRender();
    setupNavigation();
    setupReports();
  };

  // Ndryshimet shfaqen pa humbur të dhënat.
  if (!document.getElementById('application')
      .classList.contains('hidden')) {
    render();
  }
})();
</script>
