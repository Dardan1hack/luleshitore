<!doctype html><html lang="sq"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Menaxhimi i Dyqanit</title><style>
:root{font-family:Segoe UI,Arial,sans-serif;color:#15243a;background:#f3f6fb}*{box-sizing:border-box}body{margin:0}.layout{display:flex;min-height:100vh}aside{background:#10213b;color:white;width:245px;padding:22px 14px;flex-shrink:0}aside h2{font-size:21px;padding:0 12px 20px;margin:0}nav button{display:block;width:100%;background:transparent;border:0;color:#dce6f6;text-align:left;padding:13px 15px;border-radius:10px;cursor:pointer;font-size:15px;margin-bottom:4px}nav button.active,nav button:hover{background:#2468e8;color:white}main{padding:30px;flex:1;min-width:0}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}h1{font-size:28px;margin:0}h3{margin:0 0 16px}.muted{color:#64748b}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px}.stat,.panel{background:white;border:1px solid #e2e8f0;border-radius:15px;padding:20px;box-shadow:0 2px 8px #172b4d0b}.stat small{color:#64748b}.stat strong{display:block;font-size:27px;margin-top:8px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:20px}.panel{margin-top:18px}.actions{display:flex;gap:10px;flex-wrap:wrap}.btn{background:#2563eb;color:white;border:0;border-radius:9px;padding:11px 16px;cursor:pointer;font-weight:600}.btn.secondary{background:#e8efff;color:#1853bd}.btn.danger{background:#dc2626}.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}input,select{padding:12px;border:1px solid #cbd5e1;border-radius:9px;font:inherit;width:100%;background:white}label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}.field{min-width:0}.full{grid-column:1/-1}.tablewrap{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:550px}th,td{padding:12px 10px;text-align:left;border-bottom:1px solid #e5eaf2}th{background:#f7f9fc;font-size:13px}td{font-size:14px}.low{color:#dc2626;font-weight:700}.notice{background:#fff7ed;padding:13px;border-radius:9px;color:#9a3412}.hidden{display:none}.pill{font-size:12px;background:#dcfce7;color:#166534;padding:6px 10px;border-radius:20px}@media(max-width:850px){.layout{display:block}aside{width:100%;padding:12px}aside h2{padding:5px}nav{display:flex;overflow-x:auto;gap:5px}nav button{white-space:nowrap;width:auto}main{padding:15px}.stats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}}@media(max-width:500px){.form{grid-template-columns:1fr}.stat strong{font-size:22px}}
</style></head><body><div class="layout"><aside><h2>🛒 Menaxhimi i Dyqanit</h2><nav id="nav"></nav></aside><main><header><div><h1 id="title">Dashboard</h1><div class="muted">Sistemi për stokun dhe shitjet</div></div><span class="pill">● Lokal</span></header><div id="content"></div></main></div><script>
'use strict';const KEY='dyqani_edge_v1';let db;try{db=JSON.parse(localStorage.getItem(KEY))}catch{}if(!db||!Array.isArray(db.products))db={products:[],movements:[],expenses:[],nextId:1};const pages=['Dashboard','Produktet','Hyrjet','Shitjet','Stoku','Dëmet','Shpenzimet','Raportet'];let page='Dashboard';const $=id=>document.getElementById(id),money=n=>new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR'}).format(n||0),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),sum=a=>a.reduce((x,y)=>x+y,0);function save(){localStorage.setItem(KEY,JSON.stringify(db))}function totals(){const sales=db.movements.filter(x=>x.type==='Shitje'),damage=db.movements.filter(x=>x.type==='Dëm');return{revenue:sum(sales.map(x=>x.qty*x.price)),cogs:sum(sales.map(x=>x.qty*x.cost)),damage:sum(damage.map(x=>x.qty*x.cost)),expenses:sum(db.expenses.map(x=>x.amount))}}function panel(title,html){return `<section class="panel"><h3>${title}</h3>${html}</section>`}function field(label,id,type='text',extra=''){return `<div class="field"><label for="${id}">${label}</label><input id="${id}" type="${type}" ${type==='number'?'step="any" min="0"':''} ${extra} required></div>`}function options(){return db.products.map(p=>`<option value="${p.id}">${esc(p.name)} (${p.stock} copë)</option>`).join('')}function table(head,rows){return `<div class="tablewrap"><table><thead><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows||`<tr><td colspan="${head.length}" class="muted">Nuk ka regjistrime.</td></tr>`}</tbody></table></div>`}function form(html){return `<form id="form" class="form">${html}<div class="full"><button class="btn" type="submit">Ruaj</button></div></form>`}function productsTable(){return table(['Produkti','Barkodi','Stoku','Blerja','Shitja'],db.products.map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(p.barcode)}</td><td class="${p.stock<=10?'low':''}">${p.stock}</td><td>${money(p.cost)}</td><td>${money(p.price)}</td></tr>`).join(''))}function history(type){return table(['Data','Produkti','Sasia','Vlera'],db.movements.filter(x=>x.type===type).slice().reverse().map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.name)}</td><td>${x.qty}</td><td>${money(x.qty*(type==='Shitje'?x.price:x.cost))}</td></tr>`).join(''))}function render(){ $('title').textContent=page;$('nav').innerHTML=pages.map(n=>`<button data-page="${n}" class="${page===n?'active':''}">${n}</button>`).join('');$('nav').querySelectorAll('button').forEach(b=>b.onclick=()=>{page=b.dataset.page;render()});const t=totals(),profit=t.revenue-t.cogs-t.damage-t.expenses;let html='';if(page==='Dashboard'){html=`<div class="stats"><div class="stat"><small>Shitjet totale</small><strong>${money(t.revenue)}</strong></div><div class="stat"><small>Fitimi i pastër</small><strong>${money(profit)}</strong></div><div class="stat"><small>Produkte aktive</small><strong>${db.products.length}</strong></div><div class="stat"><small>Stok i ulët (≤10)</small><strong>${db.products.filter(p=>p.stock<=10).length}</strong></div></div><div class="grid">${panel('Veprime të shpejta',`<div class="actions">${['Produktet','Hyrjet','Shitjet','Dëmet'].map(n=>`<button class="btn secondary" data-go="${n}">${n}</button>`).join('')}</div>`)}${panel('Produkte me stok të ulët',table(['Produkti','Sasia'],db.products.filter(p=>p.stock<=10).map(p=>`<tr><td>${esc(p.name)}</td><td class="low">${p.stock}</td></tr>`).join('')))}</div>`}if(page==='Produktet')html=panel('Shto produkt',form(field('Emri i produktit','name')+field('Barkodi','barcode')+field('Çmimi i blerjes (€)','cost','number')+field('Çmimi i shitjes (€)','price','number')))+panel('Lista e produkteve',productsTable());if(['Hyrjet','Shitjet','Dëmet'].includes(page)){const type=page==='Hyrjet'?'Hyrje':page==='Shitjet'?'Shitje':'Dëm';html=panel(type+' e re',db.products.length?form(`${page==='Shitjet'?field('Barkodi (opsional)','scan','text','placeholder="Skano ose shkruaj barkodin"'):''}<div class="field"><label>Produkti</label><select id="product">${options()}</select></div>${field('Sasia','qty','number','step="1" min="1"')}`):'<div class="notice">Së pari shto një produkt te Produktet.</div>')+panel('Historiku',history(type))}if(page==='Stoku')html=panel('Gjendja aktuale',productsTable());if(page==='Shpenzimet')html=panel('Shto shpenzim',form(field('Përshkrimi','name')+field('Shuma (€)','amount','number')))+panel('Historiku',table(['Data','Përshkrimi','Shuma'],db.expenses.slice().reverse().map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.name)}</td><td>${money(x.amount)}</td></tr>`).join('')));if(page==='Raportet')html=panel('Raporti financiar',table(['Përshkrimi','Vlera'],[['Të ardhurat nga shitjet',t.revenue],['Kosto e produkteve të shitura',t.cogs],['Humbjet nga dëmet',t.damage],['Shpenzimet',t.expenses],['Fitimi i pastër',profit]].map(([name,val])=>`<tr><td>${name}</td><td><b>${money(val)}</b></td></tr>`).join('')))+panel('Rezervimi i të dhënave',`<div class="actions"><button class="btn secondary" id="export">Eksporto JSON</button><label class="btn secondary" style="cursor:pointer">Importo JSON<input id="import" type="file" accept="application/json" style="display:none"></label></div><p class="muted">Ruaj kopje rezervë rregullisht. Të dhënat janë vetëm në këtë shfletues.</p>`);$('content').innerHTML=html;$('content').querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{page=b.dataset.go;render()});const f=$('form');if(f)f.onsubmit=e=>{e.preventDefault();try{if(page==='Produktet'){const name=$('name').value.trim(),barcode=$('barcode').value.trim(),cost=Number($('cost').value),price=Number($('price').value);if(!name||!barcode||db.products.some(p=>p.barcode===barcode)||![cost,price].every(Number.isFinite)||cost<0||price<0)throw Error('Kontrollo emrin, barkodin unik dhe çmimet.');db.products.push({id:db.nextId++,name,barcode,cost,price,stock:0})}else if(page==='Shpenzimet'){const name=$('name').value.trim(),amount=Number($('amount').value);if(!name||!Number.isFinite(amount)||amount<=0)throw Error('Shëno një shpenzim valid.');db.expenses.push({name,amount,date:new Date().toLocaleString('sq-AL')})}else{const p=db.products.find(x=>x.id===Number($('product').value)),qty=Number($('qty').value),type=page==='Hyrjet'?'Hyrje':page==='Shitjet'?'Shitje':'Dëm';if(!p||!Number.isSafeInteger(qty)||qty<=0)throw Error('Sasia duhet të jetë numër i plotë pozitiv.');if(type!=='Hyrje'&&p.stock<qty)throw Error('Nuk ka stok të mjaftueshëm.');p.stock+=type==='Hyrje'?qty:-qty;db.movements.push({type,qty,productId:p.id,name:p.name,price:p.price,cost:p.cost,date:new Date().toLocaleString('sq-AL')})}save();render();alert('U ruajt me sukses!')}catch(err){alert(err.message)}};const scan=$('scan');if(scan)scan.addEventListener('input',()=>{const p=db.products.find(x=>x.barcode===scan.value.trim());if(p)$('product').value=p.id});if($('export'))$('export').onclick=()=>{const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='dyqani-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};if($('import'))$('import').onchange=async e=>{try{const incoming=JSON.parse(await e.target.files[0].text());if(!Array.isArray(incoming.products)||!Array.isArray(incoming.movements)||!Array.isArray(incoming.expenses)||!Number.isSafeInteger(incoming.nextId))throw Error('Format i gabuar.');if(!confirm('A t’i zëvendësojmë të dhënat ekzistuese?'))return;db=incoming;save();render()}catch(err){alert('Importimi dështoi: '+err.message)}}}render();
</script></body></html>
