
<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Luleshitore</title>
<style>
*{box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#f2f7f3;margin:0;color:#234}
header{background:#176443;color:white;padding:18px;text-align:center}
header h1{margin:0}
main{max-width:1000px;margin:auto;padding:12px}
.card{background:white;border-radius:12px;padding:17px;margin:12px 0;box-shadow:0 2px 8px #0001}
input,select,button{font:inherit;padding:12px;border-radius:8px;margin:5px 0}
input,select{width:100%;border:1px solid #ccc}
button{border:0;background:#187b53;color:white;cursor:pointer}
button:disabled{opacity:.5}
nav{display:flex;gap:5px;overflow-x:auto;padding:10px 0}
nav button{white-space:nowrap;background:#dcece2;color:#155c43}
nav button.active{background:#155c43;color:white}
.hidden{display:none}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{background:#e4f4e9;padding:14px;border-radius:10px}
.stat strong{display:block;font-size:23px;margin-top:8px}
table{width:100%;border-collapse:collapse}
td,th{padding:9px;border-bottom:1px solid #ddd;text-align:left}
.scroll{overflow-x:auto}
#reader{max-width:420px;margin:auto}
#message{padding:12px;text-align:center;display:none}
.error{background:#ffe0e0;color:#900}
.ok{background:#e0f5e7;color:#165c39}
small{color:#777}
</style>
</head>
<body>

<header>
<h1>🌹 Luleshitore</h1>
<p>Menaxhimi i stokut dhe shitjeve</p>
<button id="logout" class="hidden">Dil nga llogaria</button>
</header>

<div id="message"></div>

<main>
<section id="login" class="card">
<h2>Hyr në aplikacion</h2>
<form id="loginForm">
<label>Email</label>
<input id="email" type="email" required>
<label>Fjalëkalimi</label>
<input id="password" type="password" required>
<button type="submit">Hyr</button>
</form>
</section>

<section id="application" class="hidden">
<nav id="navigation"></nav>
<div id="content"></div>
</section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<script>
const SUPABASE_URL =
'https://ckmyfeafckmxjvdllcdk.supabase.co';

const SUPABASE_KEY =
'sb_publishable_tqbrr3-JeJDFbPqmCfxd1Q_1-T26C3z';

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const el = id => document.getElementById(id);

let products = [];
let movements = [];
let expenses = [];
let page = 'Dashboard';
let scanner = null;
let busy = false;

const pages = [
  'Dashboard',
  'Produktet',
  'Hyrjet',
  'Shitjet',
  'Stoku',
  'Dëmet',
  'Shpenzimet',
  'Raportet'
];

function euro(n) {
  return Number(n || 0).toFixed(2) + ' €';
}

function safe(value) {
  return String(value ?? '').replace(
    /[&<>"']/g,
    c => ({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#39;'
    })[c]
  );
}

function notify(text, error=false) {
  const box = el('message');
  box.textContent = text;
  box.className = error ? 'error' : 'ok';
  box.style.display = 'block';
  setTimeout(() => {
    if (box.textContent === text) {
      box.style.display = 'none';
    }
  }, 5000);
}

function report(error) {
  notify(error.message || String(error), true);
}

async function loadTable(name) {
  const result = await db.from(name)
    .select('*')
    .order('id', {ascending:false});

  if (result.error) throw result.error;
  return result.data || [];
}

async function refresh() {
  try {
    [products, movements, expenses] = await Promise.all([
      loadTable('products'),
      loadTable('stock_movements'),
      loadTable('expenses')
    ]);
    render();
  } catch(error) {
    report(error);
  }
}

function input(id, label, type='text', step='') {
  return `
    <label for="${id}">${label}</label>
    <input id="${id}" type="${type}"
      ${step ? `step="${step}"` : ''}
      required>
  `;
}

function productSelect() {
  return `
    <label>Produkti</label>
    <select id="productId" required>
      ${products.map(p => `
        <option value="${p.id}">
          ${safe(p.name)} - ${p.stock} copë
        </option>
      `).join('')}
    </select>
  `;
}

function history(type) {
  const records = movements
    .filter(m => m.movement_type === type)
    .slice(0, 30);

  return `
    <div class="card scroll">
      <h3>Regjistrimet e fundit</h3>
      <table>
        <tr>
          <th>Data</th>
          <th>Produkti</th>
          <th>Sasia</th>
        </tr>
        ${records.map(m => {
          const product = products.find(
            p => p.id === m.product_id
          );
          return `
            <tr>
              <td>${new Date(m.created_at).toLocaleDateString()}</td>
              <td>${safe(product?.name || 'Produkt')}</td>
              <td>${m.quantity}</td>
            </tr>
          `;
        }).join('')}
      </table>
    </div>
  `;
}

function render() {
  el('navigation').innerHTML = pages.map(name => `
    <button data-page="${name}"
      class="${page === name ? 'active' : ''}">
      ${name}
    </button>
  `).join('');

  document.querySelectorAll('[data-page]').forEach(button => {
    button.onclick = async () => {
      await stopScanner();
      page = button.dataset.page;
      render();
    };
  });

  const sales = movements.filter(
    m => m.movement_type === 'sale'
  );

  const damages = movements.filter(
    m => m.movement_type === 'damage'
  );

  const revenue = sales.reduce(
    (s,m) => s + Number(m.unit_price || 0)*m.quantity, 0
  );

  const cost = sales.reduce(
    (s,m) => s + Number(m.unit_cost || 0)*m.quantity, 0
  );

  const damageCost = damages.reduce(
    (s,m) => s + Number(m.unit_cost || 0)*m.quantity, 0
  );

  const expenseTotal = expenses.reduce(
    (s,e) => s + Number(e.amount || 0), 0
  );

  const profit = revenue-cost-damageCost-expenseTotal;
  let html = '';

  if (page === 'Dashboard') {
    html = `
      <div class="grid">
        <div class="stat">Shitjet<strong>${euro(revenue)}</strong></div>
        <div class="stat">Fitimi<strong>${euro(profit)}</strong></div>
        <div class="stat">Produkte<strong>${products.length}</strong></div>
        <div class="stat">Stok i ulët<strong>${
          products.filter(p => p.stock <= 10).length
        }</strong></div>
      </div>
      <div class="card">
        <h2>Mirë se erdhe 🌷</h2>
        <p>Shto produktet, regjistro hyrjet dhe shitjet.</p>
        <button id="reload">🔄 Rifresko</button>
      </div>
    `;
  }

  if (page === 'Produktet') {
    html = `
      <div class="card">
        <h2>Shto produkt</h2>
        <form id="productForm">
          ${input('name','Emri i lules')}
          ${input('barcode','Barkodi')}
          ${input('purchase','Çmimi i blerjes (€)','number','0.01')}
          ${input('price','Çmimi i shitjes (€)','number','0.01')}
          <button type="submit">Ruaj produktin</button>
        </form>
      </div>
      <div class="card scroll">
        <h3>Lista e produkteve</h3>
        <table>
          <tr>
            <th>Emri</th><th>Barkodi</th>
            <th>Çmimi</th><th>Stoku</th>
          </tr>
          ${products.map(p => `
            <tr>
              <td>${safe(p.name)}</td>
              <td>${safe(p.barcode)}</td>
              <td>${euro(p.sale_price)}</td>
              <td>${p.stock}</td>
            </tr>
          `).join('')}
        </table>
      </div>
    `;
  }

  if (['Hyrjet','Shitjet','Dëmet'].includes(page)) {
    const type = page === 'Hyrjet'
      ? 'entry'
      : page === 'Shitjet' ? 'sale' : 'damage';

    html = `
      <div class="card">
        <h2>${page}</h2>
        <form id="movementForm">
          ${type === 'sale' ? `
            <label>Barkodi</label>
            <input id="barcodeSearch"
              placeholder="Shkruaj ose skano barkodin">
            <button id="scanButton" type="button">
              📷 Skano me kamerë
            </button>
            <div id="reader"></div>
          ` : ''}
          ${productSelect()}
          ${input('quantity','Sasia','number','1')}
          <p id="selectedProduct"></p>
          <button type="submit">
            ${type === 'sale' ? 'Konfirmo shitjen' : 'Ruaj'}
          </button>
        </form>
      </div>
      ${history(type)}
    `;
  }

  if (page === 'Stoku') {
    html = `
      <div class="card scroll">
        <h2>Stoku aktual</h2>
        <table>
          <tr>
            <th>Produkti</th><th>Barkodi</th>
            <th>Sasia</th><th>Vlera</th>
          </tr>
          ${products.map(p => `
            <tr>
              <td>${safe(p.name)}</td>
              <td>${safe(p.barcode)}</td>
              <td>${p.stock}</td>
              <td>${euro(p.stock * p.purchase_price)}</td>
            </tr>
          `).join('')}
        </table>
      </div>
    `;
  }

  if (page === 'Shpenzimet') {
    html = `
      <div class="card">
        <h2>Regjistro shpenzim</h2>
        <form id="expenseForm">
          ${input('description','Përshkrimi')}
          ${input('amount','Shuma (€)','number','0.01')}
          <button type="submit">Ruaj shpenzimin</button>
        </form>
      </div>
      <div class="card scroll">
        <h3>Shpenzimet</h3>
        <table>
          <tr><th>Data</th><th>Përshkrimi</th><th>Shuma</th></tr>
          ${expenses.map(e => `
            <tr>
              <td>${new Date(e.created_at).toLocaleDateString()}</td>
              <td>${safe(e.description)}</td>
              <td>${euro(e.amount)}</td>
            </tr>
          `).join('')}
        </table>
      </div>
    `;
  }

  if (page === 'Raportet') {
    html = `
      <div class="card">
        <h2>Raporti financiar</h2>
        <p>Shitjet: <b>${euro(revenue)}</b></p>
        <p>Kosto e produkteve: <b>${euro(cost)}</b></p>
        <p>Dëmet: <b>${euro(damageCost)}</b></p>
        <p>Shpenzimet: <b>${euro(expenseTotal)}</b></p>
        <hr>
        <h3>Fitimi: ${euro(profit)}</h3>
        <small>Raporti për të gjitha regjistrimet.</small>
      </div>
    `;
  }

  el('content').innerHTML = html;

  if (el('reload')) el('reload').onclick = refresh;

  if (el('productForm')) {
    el('productForm').onsubmit = async e => {
      e.preventDefault();
      if (busy) return;
      busy = true;
      try {
        const name = el('name').value.trim();
        const barcode = el('barcode').value.trim();
        const purchase_price = Number(el('purchase').value);
        const sale_price = Number(el('price').value);

        if (!name || !barcode ||
            !Number.isFinite(purchase_price) ||
            !Number.isFinite(sale_price) ||
            purchase_price < 0 || sale_price < 0) {
          throw Error('Kontrollo të dhënat');
        }

        const result = await db.from('products').insert({
          name, barcode, purchase_price, sale_price, stock:0
        });

        if (result.error) throw result.error;
        notify('Produkti u ruajt');
        await refresh();
      } catch(error) {
        report(error);
      } finally {
        busy = false;
      }
    };
  }

  if (el('expenseForm')) {
    el('expenseForm').onsubmit = async e => {
      e.preventDefault();
      if (busy) return;
      busy = true;
      try {
        const description = el('description').value.trim();
        const amount = Number(el('amount').value);

        if (!description || !(amount > 0)) {
          throw Error('Kontrollo shpenzimin');
        }

        const result = await db.from('expenses').insert({
          description, amount
        });

        if (result.error) throw result.error;
        notify('Shpenzimi u ruajt');
        await refresh();
      } catch(error) {
        report(error);
      } finally {
        busy = false;
      }
    };
  }

  if (el('movementForm')) {
    const type = page === 'Hyrjet'
      ? 'entry'
      : page === 'Shitjet' ? 'sale' : 'damage';

    const showProduct = () => {
      const p = products.find(
        p => p.id === Number(el('productId').value)
      );
      el('selectedProduct').textContent = p
        ? `${p.name} | ${euro(p.sale_price)} | Stoku: ${p.stock}`
        : '';
    };

    el('productId').onchange = showProduct;
    showProduct();

    el('movementForm').onsubmit = async e => {
      e.preventDefault();
      if (busy) return;
      busy = true;

      try {
        const quantity = Number(el('quantity').value);
        const productId = Number(el('productId').value);

        if (!Number.isInteger(quantity) || quantity <= 0) {
          throw Error('Sasia duhet të jetë numër pozitiv');
        }

        const result = await db.rpc(
          'record_stock_movement',
          {
            p_product_id: productId,
            p_movement_type: type,
            p_quantity: quantity
          }
        );

        if (result.error) throw result.error;
        notify('Regjistrimi u krye me sukses');
        await refresh();
      } catch(error) {
        report(error);
      } finally {
        busy = false;
      }
    };

    if (el('barcodeSearch')) {
      el('barcodeSearch').oninput = () => {
        const code = el('barcodeSearch').value.trim();
        const p = products.find(p => p.barcode === code);

        if (p) {
          el('productId').value = p.id;
          showProduct();
        } else if (code) {
          el('selectedProduct').textContent =
            'Barkodi nuk u gjet';
        }
      };

      el('scanButton').onclick = toggleScanner;
    }
  }
}

async function stopScanner() {
  if (!scanner) return;
  try { await scanner.stop(); } catch(e) {}
  try { scanner.clear(); } catch(e) {}
  scanner = null;
}

async function toggleScanner() {
  if (scanner) {
    await stopScanner();
    return;
  }

  if (!window.Html5Qrcode) {
    notify('Kamera nuk u ngarkua. Kontrollo internetin.', true);
    return;
  }

  try {
    scanner = new Html5Qrcode('reader');

    await scanner.start(
      {facingMode:'environment'},
      {fps:10,qrbox:{width:260,height:160}},
      async code => {
        await stopScanner();
        const field = el('barcodeSearch');
        if (field) {
          field.value = code;
          field.dispatchEvent(new Event('input'));
          notify('Barkodi u skanua: ' + code);
        }
      }
    );
  } catch(error) {
    await stopScanner();
    report(error);
  }
}

async function showSession(session) {
  const loggedIn = !!session;

  el('login').classList.toggle('hidden', loggedIn);
  el('application').classList.toggle('hidden', !loggedIn);
  el('logout').classList.toggle('hidden', !loggedIn);

  if (loggedIn) {
    await refresh();
  } else {
    await stopScanner();
    products = [];
    movements = [];
    expenses = [];
  }
}

el('loginForm').onsubmit = async e => {
  e.preventDefault();
  const button = e.target.querySelector('button');
  button.disabled = true;

  try {
    const result = await db.auth.signInWithPassword({
      email: el('email').value.trim(),
      password: el('password').value
    });

    if (result.error) throw result.error;
  } catch(error) {
    report(error);
  } finally {
    button.disabled = false;
  }
};

el('logout').onclick = async () => {
  const result = await db.auth.signOut();
  if (result.error) report(result.error);
};

db.auth.onAuthStateChange((event, session) => {
  setTimeout(() => {
    showSession(session).catch(report);
  }, 0);
});

setInterval(async () => {
  const app = el('application');

  if (
    !app.classList.contains('hidden') &&
    !scanner &&
    !busy &&
    page !== 'Produktet' &&
    !document.querySelector('input:focus, textarea:focus, select:focus')
  ) {
    await refresh();
  }
}, 15000);
</script>
  
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>

<style>
.barcode-label {
  background:white;
  color:black;
  border:1px dashed #777;
  padding:18px;
  margin:15px auto;
  text-align:center;
  max-width:340px;
}
.barcode-label canvas {
  max-width:100%;
}
@media print {
  body * { visibility:hidden !important; }
  #barcodeLabel,
  #barcodeLabel * { visibility:visible !important; }
  #barcodeLabel {
    position:absolute;
    top:0;
    left:0;
    width:75mm;
    border:0;
    margin:0;
  }
}
</style>

<script>
(function () {
  let lastLabel = null;

  function makeBarcode() {
    const bytes = new Uint8Array(6);
    crypto.getRandomValues(bytes);

    const digits = '29' + Array.from(
      bytes,
      b => String(b % 100).padStart(2,'0')
    ).join('').slice(0,10);

    let sum = 0;
    for (let i=0; i<12; i++) {
      sum += Number(digits[i]) * (i%2===0 ? 1 : 3);
    }
    return digits + ((10-sum%10)%10);
  }

  function showLabel(product) {
    lastLabel = product;

    const area = document.getElementById('barcodeArea');
    if (!area) return;

    area.innerHTML = `
      <div id="barcodeLabel" class="barcode-label">
        <h3 id="labelName"></h3>
        <canvas id="barcodeCanvas"></canvas>
        <h2 id="labelPrice"></h2>
      </div>
      <button type="button" id="saveBarcode">
        📱 Ruaj barkodin në telefon
      </button>
      <button type="button" id="printBarcode">
        🖨️ Printo barkodin
      </button>
    `;

    document.getElementById('labelName').textContent =
      product.name;

    document.getElementById('labelPrice').textContent =
      Number(product.sale_price).toFixed(2) + ' €';

    try {
      JsBarcode('#barcodeCanvas', product.barcode, {
        format:'EAN13',
        displayValue:true,
        width:2,
        height:75,
        margin:8
      });
    } catch(error) {
      notify('Gabim gjatë krijimit të barkodit',true);
      return;
    }

    document.getElementById('saveBarcode').onclick = () => {
      const canvas = document.getElementById('barcodeCanvas');
      const image = document.createElement('canvas');
      image.width = 700;
      image.height = 370;

      const ctx = image.getContext('2d');
      ctx.fillStyle = 'white';
      ctx.fillRect(0,0,image.width,image.height);

      ctx.fillStyle = 'black';
      ctx.textAlign = 'center';

      ctx.font = 'bold 28px Arial';
      ctx.fillText(product.name,350,48,650);

      ctx.drawImage(canvas,75,65,550,210);

      ctx.font = 'bold 32px Arial';
      ctx.fillText(
        Number(product.sale_price).toFixed(2)+' €',
        350,330
      );

      image.toBlob(blob => {
        if (!blob) return;
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = 'barkod-'+product.barcode+'.png';
        link.click();
        setTimeout(() => URL.revokeObjectURL(url),10000);
      },'image/png');
    };

    document.getElementById('printBarcode').onclick = () => {
      window.print();
    };
  }

  function addBarcodeControls() {
    if (page !== 'Produktet') return;

    const form = document.getElementById('productForm');
    if (!form) return;

    const button = document.createElement('button');
    button.type = 'button';
    button.textContent = '▥ Krijo barkod automatik';

    const barcodeInput = document.getElementById('barcode');
    barcodeInput.before(button);

    button.onclick = () => {
      const code = makeBarcode();
      barcodeInput.value = code;
      barcodeInput.readOnly = true;
      notify('Barkodi u krijua. Plotëso emrin dhe çmimet.');
    };

    const area = document.createElement('div');
    area.id = 'barcodeArea';
    form.parentElement.appendChild(area);

    if (lastLabel) showLabel(lastLabel);

    form.addEventListener('submit', async () => {
      const code = barcodeInput.value.trim();
      const name = document.getElementById('name').value.trim();
      const price = Number(
        document.getElementById('price').value
      );

      if (!code || !name) return;

      setTimeout(async () => {
        try {
          const result = await db.from('products')
            .select('*')
            .eq('barcode',code)
            .maybeSingle();

          if (result.error) return;
          if (!result.data) return;

          lastLabel = result.data;
          if (page === 'Produktet') {
            showLabel(lastLabel);
          }
        } catch(error) {
          console.error(error);
        }
      },1500);
    });
  }

  const originalRender = render;
  render = function () {
    originalRender();
    addBarcodeControls();
  };
})();
</script>

<script>
(function () {
  const previousRender = render;

  function cash(n) {
    return Number(n || 0).toFixed(2) + ' €';
  }

  function dayKey(value) {
    const d = new Date(value);
    return d.getFullYear() + '-' +
      String(d.getMonth()+1).padStart(2,'0') + '-' +
      String(d.getDate()).padStart(2,'0');
  }

  function createReport() {
    const sales = movements.filter(
      m => m.movement_type === 'sale'
    );

    const damages = movements.filter(
      m => m.movement_type === 'damage'
    );

    const revenue = sales.reduce(
      (s,m) => s + Number(m.unit_price || 0)*m.quantity,0
    );

    const saleCost = sales.reduce(
      (s,m) => s + Number(m.unit_cost || 0)*m.quantity,0
    );

    const damageCost = damages.reduce(
      (s,m) => s + Number(m.unit_cost || 0)*m.quantity,0
    );

    const expensesTotal = expenses.reduce(
      (s,e) => s + Number(e.amount || 0),0
    );

    const profit =
      revenue-saleCost-damageCost-expensesTotal;

    const stockValue = products.reduce(
      (s,p) => s + Number(p.purchase_price || 0)*p.stock,0
    );

    const stockCount = products.reduce(
      (s,p) => s + Number(p.stock || 0),0
    );

    const days = [];
    const today = new Date();

    for (let i=6;i>=0;i--) {
      const d = new Date(
        today.getFullYear(),
        today.getMonth(),
        today.getDate()-i
      );

      const key = dayKey(d);

      const amount = sales
        .filter(m => dayKey(m.created_at) === key)
        .reduce(
          (s,m) => s + Number(m.unit_price || 0)*m.quantity,0
        );

      days.push({
        label:d.toLocaleDateString('sq-AL',{
          day:'2-digit',
          month:'2-digit'
        }),
        amount
      });
    }

    const max = Math.max(1,...days.map(d => d.amount));

    const cards = [
      ['💶','Shitjet',cash(revenue),'green'],
      ['📈','Fitimi',cash(profit),'green'],
      ['🧾','Shpenzimet',cash(expensesTotal),''],
      ['🥀','Dëmet',cash(damageCost),'orange'],
      ['📦','Vlera e stokut',cash(stockValue),''],
      ['🌷','Copë në stok',stockCount,''],
      ['🛒','Transaksione shitjeje',sales.length,''],
      ['🌹','Lloje produktesh',products.length,'']
    ];

    const cardsHTML = cards.map(c => `
      <div class="report-card ${c[3]}">
        <div class="symbol">${c[0]}</div>
        <span class="label">${c[1]}</span>
        <div class="value">${c[2]}</div>
      </div>
    `).join('');

    // Grafik SVG i krijuar nga të dhënat reale.
    const W = 700;
    const H = 260;
    const left = 45;
    const top = 15;
    const chartH = 185;
    const barSpace = (W-left-15)/7;

    let bars = '';

    days.forEach((day,i) => {
      const h = max > 0
        ? (day.amount/max)*chartH
        : 0;

      const x = left+i*barSpace+barSpace*.2;
      const y = top+chartH-h;
      const w = barSpace*.6;

      bars += `
        <rect x="${x}" y="${y}" width="${w}"
          height="${Math.max(h,2)}" rx="5"
          fill="#208a61"/>
        <text x="${x+w/2}" y="${Math.max(11,y-6)}"
          text-anchor="middle" font-size="11"
          fill="#40574a">${day.amount.toFixed(0)}€</text>
        <text x="${x+w/2}" y="226"
          text-anchor="middle" font-size="12"
          fill="#607469">${day.label}</text>
      `;
    });

    const chart = `
      <svg class="report-chart"
        viewBox="0 0 ${W} ${H}"
        preserveAspectRatio="xMidYMid meet"
        role="img"
        aria-label="Grafiku i shitjeve për shtatë ditët e fundit">
        <line x1="${left}" y1="${top+chartH}"
          x2="${W-15}" y2="${top+chartH}"
          stroke="#dce6df" stroke-width="2"/>
        ${bars}
      </svg>
    `;

    return `
      <div class="report-title">
        <div>
          <h2>📊 Raportet financiare</h2>
          <p>Pasqyra e luleshitores</p>
        </div>
        <div class="report-print">
          <button id="refreshReports">🔄 Rifresko</button>
          <button id="printReports">🖨️ Printo</button>
        </div>
      </div>

      <div class="report-cards">
        ${cardsHTML}
      </div>

      <div class="report-panel">
        <h3>📊 Shitjet – 7 ditët e fundit</h3>
        ${chart}
      </div>

      <div class="report-breakdown">
        <div class="report-panel">
          <h3>💰 Përmbledhja financiare</h3>
          <div class="report-line">
            <span>Të ardhurat</span>
            <strong>${cash(revenue)}</strong>
          </div>
          <div class="report-line">
            <span>Kosto e luleve të shitura</span>
            <strong>${cash(saleCost)}</strong>
          </div>
          <div class="report-line">
            <span>Dëmet</span>
            <strong>${cash(damageCost)}</strong>
          </div>
          <div class="report-line">
            <span>Shpenzimet</span>
            <strong>${cash(expensesTotal)}</strong>
          </div>
          <div class="report-line">
            <b>Fitimi i llogaritur</b>
            <strong>${cash(profit)}</strong>
          </div>
        </div>

        <div class="report-panel">
          <h3>🌷 Gjendja e stokut</h3>
          <div class="report-line">
            <span>Lloje produktesh</span>
            <strong>${products.length}</strong>
          </div>
          <div class="report-line">
            <span>Copë në stok</span>
            <strong>${stockCount}</strong>
          </div>
          <div class="report-line">
            <span>Vlera me çmim blerjeje</span>
            <strong>${cash(stockValue)}</strong>
          </div>
          <div class="report-line">
            <span>Produkte me stok 10 ose më pak</span>
            <strong>${
              products.filter(p => p.stock <= 10).length
            }</strong>
          </div>
          <p class="report-note">
            Raportet përdorin të gjitha regjistrimet.
            Fitimi është vlerësim sipas kostove dhe
            shpenzimeve të regjistruara.
          </p>
        </div>
      </div>
    `;
  }

  function setupNavigation() {
    const app = document.getElementById('application');
    const nav = document.getElementById('navigation');

    if (!app || !nav) return;

    let menu = document.getElementById('mobileNavButton');

    if (!menu) {
      menu = document.createElement('button');
      menu.id = 'mobileNavButton';
      menu.type = 'button';
      menu.textContent = '☰ Meny';
      app.insertBefore(menu,app.firstChild);

      menu.onclick = () => {
        document.body.classList.toggle('nav-open');
      };
    }

    let backdrop = document.getElementById('navBackdrop');

    if (!backdrop) {
      backdrop = document.createElement('div');
      backdrop.id = 'navBackdrop';
      document.body.appendChild(backdrop);

      backdrop.onclick = () => {
        document.body.classList.remove('nav-open');
      };
    }

    nav.querySelectorAll('button').forEach(button => {
      button.addEventListener('click',() => {
        document.body.classList.remove('nav-open');
      });
    });
  }

  function setupReports() {
    if (page !== 'Raportet') return;

    const content = document.getElementById('content');
    if (!content) return;

    content.innerHTML = createReport();

    document.getElementById('refreshReports').onclick =
      refresh;

    document.getElementById('printReports').onclick =
      () => window.print();
  }

  render = function () {
    previousRender();
    setupNavigation();
    setupReports();
  };

  // Ndryshimet shfaqen pa humbur të dhënat.
  if (!document.getElementById('application')
      .classList.contains('hidden')) {
    render();
  }
})();
</script>

<script>
(function () {
  const previousRenderAME = render;

  const filter = {
    period:'month',
    date:new Date().toLocaleDateString('en-CA'),
    month:new Date().getMonth()+1,
    year:new Date().getFullYear()
  };

  let productQuery = '';

  function fmt(n) {
    return Number(n || 0).toFixed(2) + ' €';
  }

  function localDate(value) {
    const d = new Date(value);
    return d.getFullYear() + '-' +
      String(d.getMonth()+1).padStart(2,'0') + '-' +
      String(d.getDate()).padStart(2,'0');
  }

  function inPeriod(value) {
    if (!value) return false;
    const d = new Date(value);
    if (Number.isNaN(d.getTime())) return false;

    if (filter.period === 'day') {
      return localDate(value) === filter.date;
    }
    if (filter.period === 'month') {
      return d.getFullYear() === filter.year &&
        d.getMonth()+1 === filter.month;
    }
    return d.getFullYear() === filter.year;
  }

  function optionsForYears() {
    const years = new Set([new Date().getFullYear()]);
    movements.forEach(m => {
      if (m.created_at) {
        years.add(new Date(m.created_at).getFullYear());
      }
    });
    expenses.forEach(e => {
      if (e.created_at) {
        years.add(new Date(e.created_at).getFullYear());
      }
    });
    years.add(filter.year);
    return [...years].filter(Number.isFinite)
      .sort((a,b)=>b-a);
  }

  function makeReports() {
    const sales = movements.filter(
      m => m.movement_type === 'sale' &&
        inPeriod(m.created_at)
    );

    const damages = movements.filter(
      m => m.movement_type === 'damage' &&
        inPeriod(m.created_at)
    );

    const entries = movements.filter(
      m => m.movement_type === 'entry' &&
        inPeriod(m.created_at)
    );

    const periodExpenses = expenses.filter(
      e => inPeriod(e.created_at)
    );

    const revenue = sales.reduce(
      (s,m) => s + Number(m.unit_price || 0)*m.quantity,0
    );

    const cost = sales.reduce(
      (s,m) => s + Number(m.unit_cost || 0)*m.quantity,0
    );

    const damageCost = damages.reduce(
      (s,m) => s + Number(m.unit_cost || 0)*m.quantity,0
    );

    const expenseTotal = periodExpenses.reduce(
      (s,e) => s + Number(e.amount || 0),0
    );

    const profit = revenue-cost-damageCost-expenseTotal;

    const soldUnits = sales.reduce(
      (s,m) => s+Number(m.quantity),0
    );

    const months = [
      'Janar','Shkurt','Mars','Prill','Maj','Qershor',
      'Korrik','Gusht','Shtator','Tetor','Nëntor','Dhjetor'
    ];

    const periodNames = {
      day:'Ditore',
      month:'Mujore',
      year:'Vjetore'
    };

    let periodInputs = '';

    if (filter.period === 'day') {
      periodInputs = `
        <div class="ame-field">
          <label>Data</label>
          <input id="ameDate" type="date"
            value="${filter.date}">
        </div>`;
    } else {
      periodInputs = `
        <div class="ame-field">
          <label>Viti</label>
          <select id="ameYear">
            ${optionsForYears().map(y => `
              <option value="${y}"
                ${y===filter.year?'selected':''}>${y}</option>
            `).join('')}
          </select>
        </div>`;

      if (filter.period === 'month') {
        periodInputs += `
          <div class="ame-field">
            <label>Muaji</label>
            <select id="ameMonth">
              ${months.map((m,i) => `
                <option value="${i+1}"
                  ${i+1===filter.month?'selected':''}>
                  ${m}
                </option>
              `).join('')}
            </select>
          </div>`;
      }
    }

    const cards = [
      ['💶 Shitjet',fmt(revenue)],
      ['📈 Fitimi',fmt(profit)],
      ['🧾 Shpenzimet',fmt(expenseTotal)],
      ['🥀 Dëmet',fmt(damageCost)],
      ['🛒 Copë të shitura',soldUnits],
      ['📦 Hyrje në stok',entries.reduce(
        (s,m)=>s+Number(m.quantity),0
      )],
      ['🧮 Kosto e shitjeve',fmt(cost)],
      ['🧾 Regjistrime shitjesh',sales.length]
    ];

    const cardsHTML = cards.map(c => `
      <div class="ame-result">
        <small>${c[0]}</small>
        <strong>${c[1]}</strong>
      </div>
    `).join('');

    // Grafiku përshtatet me periudhën e zgjedhur.
    let groups = [];

    if (filter.period === 'year') {
      groups = months.map((name,i) => ({
        label:name.slice(0,3),
        match:d => d.getMonth()===i
      }));
    } else if (filter.period === 'month') {
      const count = new Date(
        filter.year,filter.month,0
      ).getDate();

      groups = Array.from({length:count},(_,i)=>({
        label:String(i+1),
        match:d => d.getDate()===i+1
      }));
    } else {
      groups = Array.from({length:24},(_,i)=>({
        label:String(i).padStart(2,'0'),
        match:d => d.getHours()===i
      }));
    }

    const chartData = groups.map(g => ({
      label:g.label,
      amount:sales
        .filter(m => g.match(new Date(m.created_at)))
        .reduce(
          (s,m) => s+Number(m.unit_price || 0)*m.quantity,0
        )
    }));

    const max = Math.max(
      1,...chartData.map(d=>d.amount)
    );

    const chart = chartData.map(d => `
      <div class="ame-bar-col"
        title="${d.label}: ${fmt(d.amount)}">
        <span>${d.amount>0 ? d.amount.toFixed(0)+'€' : ''}</span>
        <div class="ame-bar"
          style="height:${d.amount>0
            ? Math.max(3,d.amount/max*150) : 2}px">
        </div>
        <span>${d.label}</span>
      </div>
    `).join('');

    return `
      <h2>📊 Raportet – AME Flower Shop</h2>
      <p style="color:#806e79">
        Shitjet dhe financat sipas periudhës
      </p>

      <div class="ame-filterbar">
        <div class="ame-field">
          <label>Lloji i raportit</label>
          <select id="amePeriod">
            <option value="day"
              ${filter.period==='day'?'selected':''}>
              Ditor
            </option>
            <option value="month"
              ${filter.period==='month'?'selected':''}>
              Mujor
            </option>
            <option value="year"
              ${filter.period==='year'?'selected':''}>
              Vjetor
            </option>
          </select>
        </div>
        ${periodInputs}
      </div>

      <h3>Raporti ${periodNames[filter.period]}</h3>
      <div class="ame-results">${cardsHTML}</div>

      <div class="ame-section">
        <h3>📈 Grafiku i shitjeve</h3>
        <div class="ame-chart">${chart}</div>
        <p style="font-size:12px;color:#867782">
          Grafiku bazohet në shitjet e regjistruara.
        </p>
      </div>

      <div class="ame-section">
        <h3>💰 Përmbledhja financiare</h3>
        <div class="ame-summary-row">
          <span>Të ardhurat</span>
          <strong>${fmt(revenue)}</strong>
        </div>
        <div class="ame-summary-row">
          <span>Kosto e produkteve të shitura</span>
          <strong>${fmt(cost)}</strong>
        </div>
        <div class="ame-summary-row">
          <span>Dëmet</span>
          <strong>${fmt(damageCost)}</strong>
        </div>
        <div class="ame-summary-row">
          <span>Shpenzimet</span>
          <strong>${fmt(expenseTotal)}</strong>
        </div>
        <div class="ame-summary-row">
          <b>Fitimi i llogaritur</b>
          <strong>${fmt(profit)}</strong>
        </div>
        <p style="font-size:12px;color:#867782">
          Fitimi është vlerësim sipas të dhënave
          të regjistruara. Nuk është raport tatimor.
        </p>
        <button id="amePrint" type="button">
          🖨️ Printo raportin
        </button>
      </div>
    `;
  }

  function updateReports() {
    if (page !== 'Raportet') return;

    const content = document.getElementById('content');
    if (!content) return;

    content.innerHTML = makeReports();

    document.getElementById('amePeriod').onchange = e => {
      filter.period = e.target.value;
      updateReports();
    };

    const date = document.getElementById('ameDate');
    if (date) date.onchange = e => {
      filter.date = e.target.value;
      updateReports();
    };

    const year = document.getElementById('ameYear');
    if (year) year.onchange = e => {
      filter.year = Number(e.target.value);
      updateReports();
    };

    const month = document.getElementById('ameMonth');
    if (month) month.onchange = e => {
      filter.month = Number(e.target.value);
      updateReports();
    };

    document.getElementById('amePrint').onclick =
      () => window.print();
  }

  function updateProductSearch() {
    if (page !== 'Produktet') return;

    const content = document.getElementById('content');
    if (!content) return;

    const tables = content.querySelectorAll('table');
    const table = tables[tables.length-1];

    if (!table) return;

    const card = table.closest('.card');
    if (!card) return;

    const input = document.createElement('input');
    input.type = 'search';
    input.className = 'ame-search';
    input.placeholder = '🔍 Kërko lulen me emër ose barkod';
    input.value = productQuery;

    const counter = document.createElement('div');
    counter.className = 'ame-search-count';

    table.before(input);
    table.before(counter);

    function search() {
      productQuery = input.value;
      const query = productQuery.trim().toLocaleLowerCase();
      let visible = 0;

      const rows = table.querySelectorAll('tr');

      rows.forEach((row,i) => {
        if (i===0) return;

        const text = row.textContent.toLocaleLowerCase();
        const match = !query || text.includes(query);
        row.style.display = match ? '' : 'none';
        if (match) visible++;
      });

      counter.textContent =
        visible + ' produkte të gjetura';
    }

    input.oninput = search;
    search();

    // Mbaje fokusin gjatë kërkimit.
    if (productQuery) {
      input.focus();
      input.setSelectionRange(
        productQuery.length,productQuery.length
      );
    }
  }

  render = function () {
    previousRenderAME();
    updateReports();
    updateProductSearch();
  };

  const app = document.getElementById('application');
  if (app && !app.classList.contains('hidden')) {
    render();
  }
})();
</script>

<script>
(function(){
  const earlierRender=render;
  const money=n=>Number(n||0).toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2})+' €';
  const localKey=d=>{const x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')};
  const total=(rows,key)=>rows.reduce((a,r)=>a+Number(r[key]||0)*Number(r.quantity||0),0);
  function dashboard(){
    const today=new Date(), key=localKey(today);
    const sales=movements.filter(x=>x.movement_type==='sale');
    const damages=movements.filter(x=>x.movement_type==='damage');
    const todaySales=sales.filter(x=>localKey(x.created_at)===key);
    const todayDamage=damages.filter(x=>localKey(x.created_at)===key);
    const todayExpenses=expenses.filter(x=>localKey(x.created_at)===key);
    const revenue=total(todaySales,'unit_price');
    const cost=total(todaySales,'unit_cost');
    const damageCost=total(todayDamage,'unit_cost');
    const expensesCost=todayExpenses.reduce((a,x)=>a+Number(x.amount||0),0);
    const profit=revenue-cost-damageCost-expensesCost;
    const stock=products.reduce((a,x)=>a+Number(x.stock||0),0);
    const low=products.filter(x=>Number(x.stock)<=10).sort((a,b)=>a.stock-b.stock);
    const week=Array.from({length:7},(_,i)=>{
      const d=new Date(today.getFullYear(),today.getMonth(),today.getDate()-(6-i));
      const k=localKey(d);
      return {label:d.toLocaleDateString('sq-AL',{weekday:'short'}),value:total(sales.filter(x=>localKey(x.created_at)===k),'unit_price')};
    });
    const max=Math.max(1,...week.map(x=>x.value));
    const bars=week.map((x,i)=>{
      const h=x.value/max*135,px=52+i*82;
      return `<rect x="${px}" y="${177-h}" width="39" height="${Math.max(1,h)}" rx="6" fill="#b95180"><title>${safe(x.label)}: ${money(x.value)}</title></rect><text x="${px+19.5}" y="199" text-anchor="middle" font-size="12" fill="#8d7482">${safe(x.label)}</text>`;
    }).join('');
    const sums=new Map();
    sales.forEach(m=>sums.set(m.product_id,(sums.get(m.product_id)||0)+Number(m.quantity||0)));
    const top=[...sums].sort((a,b)=>b[1]-a[1]).slice(0,5);
    const metric=(icon,label,value,note)=>`<div class="ame-metric"><div class="metric-top"><span class="metric-label">${label}</span><span class="metric-icon">${icon}</span></div><strong>${value}</strong><small>${note}</small></div>`;
    return `<div class="ame-dash">
      <div class="ame-welcome"><div><h2>Mirë se erdhe në AME 🌸</h2><p>Pasqyra e dyqanit për ${today.toLocaleDateString('sq-AL',{day:'numeric',month:'long',year:'numeric'})}</p></div><span class="flower" aria-hidden="true">🌷</span></div>
      <div class="ame-dash-head"><div><h3>Pasqyra e sotme</h3><p>Të dhëna nga regjistrimet e dyqanit</p></div><button type="button" id="ameRefresh">↻ Rifresko</button></div>
      <div class="ame-metrics">${metric('💶','Shitjet sot',money(revenue),todaySales.length+' transaksione')}${metric('📈','Fitimi sot',money(profit),'Pas kostove, dëmeve dhe shpenzimeve')}${metric('🌷','Copë në stok',stock,products.length+' lloje produktesh')}${metric('⚠️','Stok i ulët',low.length,'Produkte me 10 copë ose më pak')}</div>
      <div class="ame-dash-grid"><section class="ame-panel"><h3>📊 Shitjet — 7 ditët e fundit</h3><svg class="ame-chart" viewBox="0 0 650 220" role="img" aria-label="Grafiku i shitjeve gjatë 7 ditëve"><line x1="35" y1="177" x2="625" y2="177" stroke="#e8d9e1"/><line x1="35" y1="107" x2="625" y2="107" stroke="#f4eaf0" stroke-dasharray="4 4"/><text x="32" y="24" font-size="12" fill="#8d7482">${money(max)}</text>${bars}</svg></section>
      <section class="ame-panel"><h3>⚡ Veprime të shpejta</h3><div class="ame-quick"><button data-ame-page="Shitjet">🛒 Shitje e re</button><button data-ame-page="Hyrjet">📦 Shto hyrje</button><button data-ame-page="Produktet">🌸 Produkt i ri</button><button data-ame-page="Raportet">📊 Raportet</button></div><p style="font-size:12px;color:#9a8390;margin:18px 0 0">Përdor menynë anash për funksionet tjera.</p></section></div>
      <div class="ame-dash-grid"><section class="ame-panel"><h3>🏆 Lulet më të shitura — gjithsej</h3>${top.length?top.map(([id,count],i)=>{const p=products.find(x=>x.id===id);return `<div class="ame-item"><span><b>${i+1}. ${safe(p?.name||'Produkt')}</b><small>${safe(p?.barcode||'')}</small></span><strong>${count} copë</strong></div>`}).join(''):'<p class="ame-empty">Ende nuk ka shitje të regjistruara.</p>'}</section>
      <section class="ame-panel"><h3>⚠️ Produkte me stok të ulët</h3>${low.length?low.slice(0,6).map(p=>`<div class="ame-item"><span><b>${safe(p.name)}</b><small>${safe(p.barcode)}</small></span><span class="ame-pill">${Number(p.stock)} copë</span></div>`).join(''):'<p class="ame-empty">Shumë mirë! Nuk ka produkte me stok të ulët.</p>'}</section></div>
      <p style="font-size:12px;color:#927b87;margin:0">Fitimi është llogaritje orientuese nga çmimet dhe shpenzimet e regjistruara. Grafiku tregon shitjet reale, pa të dhëna shembull.</p>
    </div>`;
  }
  render=function(){
    earlierRender();
    if(page!=='Dashboard'||!document.getElementById('content'))return;
    document.getElementById('content').innerHTML=dashboard();
    document.getElementById('ameRefresh').onclick=refresh;
    document.querySelectorAll('[data-ame-page]').forEach(b=>b.onclick=async()=>{await stopScanner();page=b.dataset.amePage;render();document.body.classList.remove('nav-open')});
  };
  if(!document.getElementById('application').classList.contains('hidden'))render();
})();
</script>

<script>
(function () {
  const oldAMErender = render;

  function addAMEPrint() {
    if (page !== 'Shitjet') return;

    const form = document.getElementById('movementForm');
    const select = document.getElementById('productId');

    if (!form || !select ||
        document.getElementById('amePrintButton')) return;

    const button = document.createElement('button');
    button.type = 'button';
    button.id = 'amePrintButton';
    button.textContent = '🖨️ Printo barkodin';

    const label = document.createElement('div');
    label.id = 'amePrintLabel';
    label.innerHTML = `
      <h3 id="ameLabelName"></h3>
      <canvas id="ameLabelBarcode"></canvas>
      <h2 id="ameLabelPrice"></h2>
    `;

    form.appendChild(button);
    form.appendChild(label);

    button.onclick = function () {
      const p = products.find(
        x => String(x.id) === String(select.value)
      );

      if (!p) {
        notify('Zgjedhe produktin', true);
        return;
      }

      if (!p.barcode) {
        notify('Produkti nuk ka barkod', true);
        return;
      }

      if (typeof JsBarcode === 'undefined') {
        notify('Barkodi nuk u ngarkua', true);
        return;
      }

      document.getElementById('ameLabelName')
        .textContent = p.name;

      document.getElementById('ameLabelPrice')
        .textContent = euro(p.sale_price);

      try {
        const code = String(p.barcode);

        JsBarcode('#ameLabelBarcode', code, {
          format: /^\d{13}$/.test(code)
            ? 'EAN13' : 'CODE128',
          displayValue:true,
          width:2,
          height:70,
          margin:8
        });

        document.body.classList.add('ame-print-mode');
        window.print();

      } catch (error) {
        document.body.classList.remove('ame-print-mode');
        notify(error.message, true);
      }
    };
  }

  window.addEventListener('afterprint', () => {
    document.body.classList.remove('ame-print-mode');
  });

  render = function () {
    oldAMErender();
    addAMEPrint();
  };

  if (!document.getElementById('application')
      .classList.contains('hidden')) {
    addAMEPrint();
  }
})();
</script>

<script>
(function () {
  function printAMEProduct(product) {
    if (!product || !product.barcode) {
      notify('Produkti nuk ka barkod',true);
      return;
    }

    if (typeof JsBarcode === 'undefined') {
      notify('Barkodi nuk u ngarkua',true);
      return;
    }

    let label = document.getElementById(
      'ame-product-label'
    );

    if (!label) {
      label = document.createElement('div');
      label.id = 'ame-product-label';
      document.body.appendChild(label);
    }

    label.innerHTML = '';

    const name = document.createElement('div');
    name.className = 'ame-name';
    name.textContent = product.name;

    const canvas = document.createElement('canvas');

    const price = document.createElement('div');
    price.className = 'ame-price';
    price.textContent = euro(product.sale_price);

    label.append(name,canvas,price);

    try {
      const barcode = String(product.barcode);
      JsBarcode(canvas,barcode,{
        format:/^\d{13}$/.test(barcode)
          ? 'EAN13' : 'CODE128',
        displayValue:true,
        width:1.5,
        height:38,
        fontSize:11,
        margin:2
      });

      document.body.classList.add(
        'ame-product-print'
      );

      window.print();
    } catch (error) {
      document.body.classList.remove(
        'ame-product-print'
      );
      notify('Gabim: '+error.message,true);
    }
  }

  function addAMEProductButtons() {
    if (page !== 'Produktet') return;

    const table = document.querySelector(
      '#content .card.scroll table'
    );

    if (!table) return;

    const rows = table.querySelectorAll('tr');

    if (!rows.length) return;

    if (!table.querySelector('.ame-print-heading')) {
      const th = document.createElement('th');
      th.textContent = 'Etiketa';
      th.className = 'ame-print-heading';
      rows[0].appendChild(th);
    }

    products.forEach((product,index) => {
      const row = rows[index+1];
      if (!row || row.querySelector(
        '.ame-print-row'
      )) return;

      const cell = document.createElement('td');
      const button = document.createElement('button');

      button.type = 'button';
      button.className = 'ame-print-row';
      button.textContent = '🖨️ Printo';

      button.onclick = () => {
        printAMEProduct(product);
      };

      cell.appendChild(button);
      row.appendChild(cell);
    });
  }

  window.addEventListener('afterprint',() => {
    document.body.classList.remove(
      'ame-product-print'
    );
  });

  const oldRenderPrintAME = render;

  render = function () {
    oldRenderPrintAME();
    addAMEProductButtons();
  };

  addAMEProductButtons();
})();
</script>

<script>
/* AME - BACKUP DHE STOKU I ULËT */
(function () {
  function downloadBackup() {
    try {
      const backup = {
        application:'AME Flower Shop',
        created_at:new Date().toISOString(),
        products:products,
        stock_movements:movements,
        expenses:expenses
      };

      const data = JSON.stringify(backup,null,2);
      const blob = new Blob(
        [data],
        {type:'application/json;charset=utf-8'}
      );

      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');

      link.href = url;
      link.download =
        'AME-Backup-' +
        new Date().toISOString().slice(0,10) +
        '.json';

      document.body.appendChild(link);
      link.click();
      link.remove();

      setTimeout(() => {
        URL.revokeObjectURL(url);
      },10000);

      notify('Backup u përgatit për shkarkim');
    } catch(error) {
      notify('Gabim në backup: '+error.message,true);
    }
  }

  function addAMETools() {
    if (page !== 'Dashboard') return;

    const content = document.getElementById('content');
    if (!content) return;

    if (document.getElementById('ameTools')) return;

    const low = products.filter(p =>
      Number(p.stock || 0) <= 3
    );

    const panel = document.createElement('section');
    panel.id = 'ameTools';
    panel.className = 'ame-tools';

    const heading = document.createElement('h3');
    heading.textContent = '🌸 Menaxhimi i dyqanit';
    panel.appendChild(heading);

    const button = document.createElement('button');
    button.type = 'button';
    button.textContent = '📥 Shkarko backup';
    button.onclick = downloadBackup;
    panel.appendChild(button);

    const title = document.createElement('h3');
    title.style.marginTop = '18px';
    title.textContent =
      '⚠️ Stoku kritik: ' + low.length + ' produkte';
    panel.appendChild(title);

    if (low.length === 0) {
      const ok = document.createElement('p');
      ok.textContent =
        'Nuk ka produkte me 3 copë ose më pak.';
      panel.appendChild(ok);
    }

    low.forEach(product => {
      const row = document.createElement('div');

<script>
(function () {
  function showBouquetBuilder() {
    if (page !== 'Shitjet') return;
    const content = document.getElementById('content');
    if (!content || document.getElementById('ameBouquetBox')) return;

    const box = document.createElement('section');
    box.id = 'ameBouquetBox';
    box.innerHTML = `
      <h3>💐 Krijo buqetë</h3>
      <p>Zgjedhi lulet dhe sasitë për buqetën.</p>
      <div id="ameBouquetLines"></div>
      <button type="button" id="ameBouquetAdd">
        + Shto lule
      </button>
      <label for="ameBouquetExtra">
        Paketimi dhe dekorimi (€)
      </label>
      <input id="ameBouquetExtra" type="number"
        min="0" step="0.01" value="0">
      <label for="ameBouquetDiscount">
        Zbritja (€)
      </label>
      <input id="ameBouquetDiscount" type="number"
        min="0" step="0.01" value="0">
      <div id="ameBouquetSummary"></div>
      <small>
        Kjo është përllogaritje.
        Nuk regjistron shitje dhe nuk zbret stokun.
      </small>
    `;

    const saleForm = document.getElementById('movementForm');
    if (saleForm) saleForm.parentElement.after(box);
    else content.prepend(box);

    const lines = box.querySelector('#ameBouquetLines');
    const summary = box.querySelector('#ameBouquetSummary');

    function addLine() {
      const row = document.createElement('div');
      row.className = 'ame-bouquet-line';

      const select = document.createElement('select');
      products.forEach(p => {
        const opt = document.createElement('option');
        opt.value = String(p.id);
        opt.textContent = p.name + ' (' + p.stock + ')';
        select.appendChild(opt);
      });

      const qty = document.createElement('input');
      qty.type = 'number';
      qty.min = '1';
      qty.step = '1';
      qty.value = '1';
      qty.setAttribute('aria-label','Sasia');

      const remove = document.createElement('button');
      remove.type = 'button';
      remove.textContent = '×';
      remove.setAttribute('aria-label','Hiq lulen');

      row.append(select,qty,remove);
      lines.appendChild(row);

      select.onchange = calculate;
      qty.oninput = calculate;
      remove.onclick = () => {
        row.remove();
        calculate();
      };
      calculate();
    }

    function calculate() {
      let total = 0;
      let cost = 0;
      const selected = new Map();

      lines.querySelectorAll('.ame-bouquet-line')
        .forEach(row => {
          const id = row.querySelector('select').value;
          const qty = Number(
            row.querySelector('input').value
          );
          if (!Number.isInteger(qty) || qty <= 0) return;
          selected.set(id,(selected.get(id)||0)+qty);
        });

      const details = [];
      let insufficient = false;

      selected.forEach((qty,id) => {
        const p = products.find(x =>
          String(x.id) === id
        );
        if (!p) return;

        total += Number(p.sale_price||0)*qty;
        cost += Number(p.purchase_price||0)*qty;

        if (qty > Number(p.stock||0)) {
          insufficient = true;
        }
        details.push(
          p.name + ': ' + qty + ' copë'
        );
      });

      const extra = Math.max(0,Number(
        box.querySelector('#ameBouquetExtra').value
      )||0);
      const discount = Math.max(0,Number(
        box.querySelector('#ameBouquetDiscount').value
      )||0);

      const finalPrice = Math.max(0,total+extra-discount);

      summary.replaceChildren();

      const list = document.createElement('p');
      list.style.whiteSpace = 'pre-line';
      list.textContent = details.join('\n') ||
        'Shto lule për buqetën.';

      const price = document.createElement('h3');
      price.textContent =
        'Çmimi i buqetës: ' + euro(finalPrice);

      const profit = document.createElement('p');
      profit.textContent =
        'Fitimi i përafërt: ' + euro(finalPrice-cost);

      summary.append(list,price,profit);

      if (insufficient) {
        const warning = document.createElement('p');
        warning.style.color = '#a12345';
        warning.textContent =
          '⚠️ Nuk ka stok të mjaftueshëm për disa lule.';
        summary.appendChild(warning);
      }
    }

    box.querySelector('#ameBouquetAdd').onclick = addLine;
    box.querySelector('#ameBouquetExtra').oninput = calculate;
    box.querySelector('#ameBouquetDiscount').oninput = calculate;

    if (products.length) addLine();
    else calculate();
  }

  const previousBouquetRender = render;
  render = function () {
    previousBouquetRender();
    showBouquetBuilder();
  };

  showBouquetBuilder();
})();
</script>

<script>

(function () {
  let role = null;
  let sellerProducts = [];
  let saving = false;
  let sessionVersion = 0;

  const oldShowSession = showSession;
  const oldRefresh = refresh;
  const oldRender = render;

  function hidePrivatePages() {
    document.getElementById('application')
      .classList.add('hidden');
  }

  async function loadSellerProducts() {
    const {data,error} = await db.rpc(
      'ame_seller_products'
    );
    if (error) throw error;
    sellerProducts = data || [];
  }

  function drawCashier() {
    if (role !== 'seller') return;

    const content = document.getElementById('content');
    if (!content) return;

    content.innerHTML = `
      <section class="ame-cashier">
        <h2>🌸 AME Flower Shop</h2>
        <p>Arka – Shitjet</p>

          </label>
          <input id="barcodeSearch"
            placeholder="Shkruaj ose skano barkodin"
            autocomplete="off">

          <button type="button" id="scanButton"
            class="ame-full">
            📷 Skano barkodin
          </button>
          <div id="reader"></div>

          <label for="productId">Produkti</label>
          <select id="productId" required></select>

          <p id="selectedProduct"></p>

          <label for="quantity">Sasia</label>
          <input id="quantity" type="number"
            min="1" step="1" value="1" required>

          <label for="amePayment">
            Mënyra e pagesës
          </label>
          <select id="amePayment">
            <option value="cash">Cash</option>
            <option value="iban">IBAN</option>
            <option value="wolt">Wolt</option>
          </select>

          <div class="ame-total" id="ameTotal">
            Totali: 0.00 €
          </div>

          <button id="ameFinishSale"
            type="submit" class="ame-full">
            ✓ Përfundo shitjen
          </button>
        </form>
      </section>
    `;

    const form = document.getElementById(
      'ameCashierForm'
    );
    const select = document.getElementById('productId');
    const quantity = document.getElementById('quantity');
    const barcode = document.getElementById(
      'barcodeSearch'
    );

    sellerProducts.forEach(p => {
      const option = document.createElement('option');
      option.value = String(p.id);
      option.textContent =
        p.name + ' – ' + euro(p.sale_price);
      select.appendChild(option);
    });

    function updateTotal() {
      const p = sellerProducts.find(x =>
        String(x.id) === select.value
      );
      const qty = Number(quantity.value) || 0;

      document.getElementById(
        'selectedProduct'
      ).textContent = p
        ? 'Në stok: ' + p.stock + ' copë'
        : 'Nuk ka produkte';

      document.getElementById(
        'ameTotal'
      ).textContent = 'Totali: ' +
        euro(p ? Number(p.sale_price)*qty : 0);
    }

    select.onchange = updateTotal;
    quantity.oninput = updateTotal;

    barcode.oninput = () => {
      const p = sellerProducts.find(x =>
        String(x.barcode) === barcode.value.trim()
      );
      if (p) {
        select.value = String(p.id);
        updateTotal();
      }
    };

    document.getElementById(
      'scanButton'
    ).onclick = toggleScanner;

    form.onsubmit = async e => {
      e.preventDefault();
      if (saving) return;

      const p = sellerProducts.find(x =>
        String(x.id) === select.value
      );
      const qty = Number(quantity.value);
      const payment = document.getElementById(
        'amePayment'
      ).value;

      if (!p || !Number.isInteger(qty) ||
          qty < 1 || qty > Number(p.stock)) {
        notify('Kontrollo sasine dhe stokun',true);
        return;
      }

      saving = true;
      const button = document.getElementById(
        'ameFinishSale'
      );
      button.disabled = true;
      button.textContent = 'Duke regjistruar...';

      try {
        const result = await db.rpc(
          'ame_register_sale',
          {
            p_product_id:Number(p.id),
            p_quantity:qty,
            p_payment_method:payment
          }
        );

        if (result.error) throw result.error;

        notify('Shitja u regjistrua!');
        await stopScanner();
        await loadSellerProducts();
        drawCashier();
      } catch(error) {
        report(error);
        button.disabled = false;
        button.textContent = '✓ Përfundo shitjen';
      } finally {
        saving = false;
      }
    };

    updateTotal();
  }

  showSession = async function(session) {
    const version = ++sessionVersion;
    hidePrivatePages();

    if (!session) {
      role = null;
      sellerProducts = [];
      document.body.classList.remove('ame-seller');
      return oldShowSession(session);
    }

    try {
      const result = await db.from('user_roles')
        .select('role')
        .eq('user_id',session.user.id)
        .single();

      if (result.error) throw result.error;
      if (version !== sessionVersion) return;

      if (result.data.role === 'admin') {
        role = 'admin';
        document.body.classList.remove('ame-seller');
        await oldShowSession(session);
        return;
      }

      if (result.data.role !== 'seller') {
        throw Error('Roli nuk eshte i lejuar');
      }

      role = 'seller';
      document.body.classList.add('ame-seller');
      await loadSellerProducts();

      if (version !== sessionVersion) return;

      products = [];
      movements = [];
      expenses = [];
      page = 'Shitjet';

      document.getElementById('login')
        .classList.add('hidden');
      document.getElementById('logout')
        .classList.remove('hidden');
      document.getElementById('application')
        .classList.remove('hidden');

      drawCashier();
    } catch(error) {
      if (version !== sessionVersion) return;
      role = null;
      hidePrivatePages();
      report(error);
    }
  };

  refresh = async function() {
    if (role === 'seller') {
      if (saving || scanner ||
          document.activeElement?.matches(
            'input,select,textarea'
          )) return;
      try {
        await loadSellerProducts();
        drawCashier();
      } catch(error) {
        report(error);
      }
      return;
    }

    if (role === 'admin') {
      return oldRefresh();
    }
  };

  render = function() {
    if (role === 'seller') {
      drawCashier();
      return;
    }
    if (role === 'admin') {
      return oldRender();
    }
  };

  db.auth.getSession().then(({data,error}) => {
    if (error) {
      report(error);
      return;
    }
    showSession(data.session).catch(report);
  });
})();
</script>
  <style>
#ameAdminPaymentBox {
  margin:14px 0;
  padding:14px;
  background:#fff3f8;
  border:1px solid #e9cad9;
  border-radius:12px;
}
#ameAdminPaymentBox label {
  display:block;
  font-weight:700;
  color:#7b214c;
  margin-bottom:8px;
}
#ameAdminPayment {
  width:100%;
  min-height:48px;
  font-size:16px;
  background:white;
}
</style>
<script>
(function () {
  let savingAdminSale = false;

  function addAdminPayment() {
    if (page !== 'Shitjet') return;
    if (document.body.classList.contains('ame-seller')) return;

    const form = document.getElementById('movementForm');
    if (!form || document.getElementById('ameAdminPayment')) return;

    const box = document.createElement('div');
    box.id = 'ameAdminPaymentBox';

    const label = document.createElement('label');
    label.htmlFor = 'ameAdminPayment';
    label.textContent = 'Mënyra e pagesës';

    const select = document.createElement('select');
    select.id = 'ameAdminPayment';

    [
      ['cash','Cash – Para në dorë'],
      ['iban','IBAN – Transfer bankar'],
      ['wolt','Wolt – Porosi']
    ].forEach(([value,text]) => {
      const option = document.createElement('option');
      option.value = value;
      option.textContent = text;
      select.appendChild(option);
    });

    box.append(label,select);

    const submit = form.querySelector('button[type="submit"]');
    if (submit) submit.before(box);
    else form.appendChild(box);
  }

  // Kap submit-in para kodit te vjeter.
  // Nje klikim = vetem nje thirrje RPC.
  document.addEventListener('submit',async function(event) {
    const form = event.target;

    if (
      form.id !== 'movementForm' ||
      page !== 'Shitjet' ||
      document.body.classList.contains('ame-seller') ||
      !document.getElementById('ameAdminPayment')
    ) return;

    event.preventDefault();
    event.stopImmediatePropagation();

    if (savingAdminSale) return;

    const productId = Number(
      document.getElementById('productId')?.value
    );
    const quantity = Number(
      document.getElementById('quantity')?.value
    );
    const payment = document.getElementById(
      'ameAdminPayment'
    ).value;

    const product = products.find(p =>
      Number(p.id) === productId
    );

    if (!product ||
        !Number.isInteger(quantity) ||
        quantity < 1 ||
        quantity > Number(product.stock)) {
      notify('Kontrollo produktin, sasine dhe stokun',true);
      return;
    }

    savingAdminSale = true;
    busy = true;

    const button = form.querySelector(
      'button[type="submit"]'
    );

    if (button) {
      button.disabled = true;
      button.textContent = 'Duke regjistruar...';
    }

    try {
      const {data,error} = await db.rpc(
        'ame_register_sale',
        {
          p_product_id:productId,
          p_quantity:quantity,
          p_payment_method:payment
        }
      );

      if (error) throw error;

      notify('Shitja u regjistrua! Nr: ' + data);

      if (typeof stopScanner === 'function') {
        await stopScanner();
      }

      busy = false;
      await refresh();
    } catch(error) {
      report(error);
      if (button && button.isConnected) {
        button.disabled = false;
        button.textContent = 'Konfirmo shitjen';
      }
    } finally {
      savingAdminSale = false;
      busy = false;
    }
  },true);

  const previousRenderAdminPayment = render;

  render = function() {
    previousRenderAdminPayment();
    addAdminPayment();
  };

  addAdminPayment();
})();
</script>
